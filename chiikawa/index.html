<title>치이카와 키우기 🐣</title>

<style>
  /* 치이카와 다마고치 — 구형 안드로이드 크롬(Chrome 60대~) 호환 스타일
     · dvh/svh, aspect-ratio, clamp(), min()/max(), inset, translate 속성, flex gap 미사용
     · 화면 높이는 position:fixed + top/bottom 로 확보, 무대는 min-height 280px 고정 */
  *,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow:hidden;background:#ffd7e6;overscroll-behavior:none}
  body{
    font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","Trebuchet MS",system-ui,sans-serif;
    color:#3b2a20;font-weight:700;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  }
  button{font-family:inherit;font-weight:800;color:inherit;cursor:pointer;background:none;border:0;margin:0;padding:0}

  /* ── 앱 틀 ─────────────────────────────── */
  #app{
    position:fixed;top:0;right:0;bottom:0;left:0;
    display:grid;grid-template-columns:1fr;
    grid-template-rows:auto minmax(280px,1fr) auto auto;
    grid-template-areas:"hud" "stage" "stats" "dock";
    grid-gap:6px;gap:6px;padding:6px;overflow:hidden;
    background:radial-gradient(circle at 15% 0%,#fff6fb 0%,rgba(255,246,251,0) 45%),
               linear-gradient(#ffe1ee,#ffc9dd 55%,#ffb6d2);
  }
  #app::before{
    content:"";position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;opacity:.5;
    background-image:radial-gradient(rgba(255,255,255,.9) 1.1px,rgba(255,255,255,0) 1.2px);
    background-size:13px 13px;
  }
  @supports(padding-top:env(safe-area-inset-top)){
    #app{padding-top:calc(6px + env(safe-area-inset-top));padding-bottom:calc(6px + env(safe-area-inset-bottom))}
  }

  /* ── HUD ───────────────────────────────── */
  .hud{
    grid-area:hud;position:relative;z-index:5;display:flex;align-items:center;justify-content:space-between;
    padding:4px 6px 4px 7px;border:3px solid #3b2a20;border-radius:16px;background:#fff9f2;
    box-shadow:0 3px 0 rgba(59,42,32,.2);
  }
  .nametag{display:flex;align-items:center;min-width:0}
  .nametag > * + *{margin-left:7px}
  .lvl{
    background:#ffd35c;border:2.5px solid #3b2a20;border-radius:99px;padding:1px 8px;
    font-size:12px;line-height:1.5;white-space:nowrap;box-shadow:0 2px 0 rgba(59,42,32,.18)
  }
  .nm{min-width:0}
  .nm-name{font-size:15px;line-height:1.1;letter-spacing:-.02em;white-space:nowrap}
  .xp{width:84px;height:8px;border:2px solid #3b2a20;border-radius:99px;background:#ffe3ec;overflow:hidden;margin-top:3px}
  .xp i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#ffa9c9,#ff6fa5);transition:width .4s}
  .hud-right{display:flex;align-items:center}
  .hud-right > * + *{margin-left:5px}
  .candy{
    display:flex;align-items:center;background:#fff2c2;border:2.5px solid #3b2a20;border-radius:99px;
    padding:1px 9px 1px 5px;font-size:14px;box-shadow:0 2px 0 rgba(59,42,32,.18)
  }
  .candy > * + *{margin-left:3px}
  .candy .c-ico{display:block;line-height:1}
  .candy svg{width:15px;height:15px;display:block}
  .round{
    width:34px;height:34px;border:2.5px solid #3b2a20;border-radius:50%;background:#fff;
    display:flex;align-items:center;justify-content:center;font-size:15px;
    box-shadow:0 2px 0 rgba(59,42,32,.18);padding:0;line-height:1
  }
  .round:active{transform:translateY(2px);box-shadow:none}
  .round.muted{background:#ffe3ec}

  /* ── 무대(방) ───────────────────────────── */
  .stage{
    grid-area:stage;position:relative;min-height:280px;min-width:0;
    border:3px solid #3b2a20;border-radius:20px;overflow:hidden;background:#fff;
    box-shadow:inset 0 0 0 4px #ffeaf3,0 3px 0 rgba(59,42,32,.18)
  }
  .room{position:absolute;top:0;right:0;bottom:0;left:0;overflow:hidden;transition:background .4s}
  .wall{position:absolute;left:0;right:0;top:0;height:63%;background:linear-gradient(#fff8fc,#ffeaf4 65%,#ffddec)}
  .wall::after{
    content:"";position:absolute;top:0;right:0;bottom:0;left:0;opacity:.55;
    background-image:radial-gradient(#ffcee2 1.7px,rgba(255,206,226,0) 1.8px);
    background-size:26px 26px
  }
  .floor{position:absolute;left:0;right:0;bottom:0;height:37%;background:linear-gradient(#fdeed9,#f6d9ba);border-top:4px solid #f0cfae}
  .floor::after{
    content:"";position:absolute;top:0;right:0;bottom:0;left:0;opacity:.4;
    background-image:repeating-linear-gradient(90deg,rgba(196,148,102,.16) 0,rgba(196,148,102,.16) 2px,rgba(196,148,102,0) 2px,rgba(196,148,102,0) 48px)
  }
  .rug{
    position:absolute;left:50%;bottom:3%;width:66%;height:17%;transform:translateX(-50%);
    background:#ffe4f0;border-radius:50%;opacity:.95;box-shadow:inset 0 0 0 6px #ffc4dc
  }
  .char-wrap.dirty #dirtLayer{opacity:1}
  .window{
    position:absolute;left:7%;top:8%;width:21%;height:15%;
    background:radial-gradient(circle at 30% 68%,#ffffff 0,#ffffff 20%,rgba(255,255,255,0) 21%),
               radial-gradient(circle at 52% 62%,#ffffff 0,#ffffff 15%,rgba(255,255,255,0) 16%),
               linear-gradient(#dcf2ff,#f2fbff);
    border:3px solid #3b2a20;border-radius:12px;box-shadow:inset 0 0 0 3px #fff
  }
  .window::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;background:#3b2a20;transform:translateX(-50%)}
  .window::after{content:"";position:absolute;top:50%;left:0;right:0;height:3px;background:#3b2a20;transform:translateY(-50%)}
  .decos{position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none}
  .deco{position:absolute;font-size:26px;line-height:1}
  .deco.small{font-size:18px}
  .deco.tiny{font-size:14px}
  .sun{position:absolute;right:9%;top:8%;font-size:30px;animation:spin 26s linear infinite}

  /* 방 테마 */
  .room[data-theme="flower"] .wall{background:linear-gradient(#f2fdf6,#ddf7e6)}
  .room[data-theme="flower"] .wall::after{background-image:radial-gradient(#bdeecb 1.7px,rgba(189,238,203,0) 1.8px)}
  .room[data-theme="flower"] .floor{background:linear-gradient(#d6f2c6,#aee2a0)}
  .room[data-theme="flower"] .floor::after{background-image:none}
  .room[data-theme="flower"] .rug{background:#fff3c4;box-shadow:inset 0 0 0 6px #ffdf7e}
  .room[data-theme="night"] .wall{background:linear-gradient(#2b2f63,#3d4278)}
  .room[data-theme="night"] .wall::after{background-image:radial-gradient(#8f96d8 1.7px,rgba(143,150,216,0) 1.8px)}
  .room[data-theme="night"] .floor{background:linear-gradient(#3a3f74,#2c3060)}
  .room[data-theme="night"] .floor::after{background-image:none}
  .room[data-theme="night"] .rug{background:#5a5fa0;box-shadow:inset 0 0 0 6px #7a80c8}
  .room[data-theme="night"] .window{background:linear-gradient(#1b2050,#2d3368)}
  .room[data-theme="strawberry"] .wall{background:linear-gradient(#fff6fa,#ffe4ee)}
  .room[data-theme="strawberry"] .wall::after{background-image:radial-gradient(#ffc6da 1.7px,rgba(255,198,218,0) 1.8px)}
  .room[data-theme="strawberry"] .floor{background:linear-gradient(#ffdcea,#ffc4d8)}
  .room[data-theme="strawberry"] .floor::after{background-image:none}
  .room[data-theme="strawberry"] .rug{background:#fff2f7;box-shadow:inset 0 0 0 6px #ffa8c8}
  .room[data-theme="strawberry"] .window{background:linear-gradient(#ffe2ee,#fff4f8)}

  /* ── 캐릭터 ────────────────────────────── */
  .char-wrap{
    position:absolute;left:0;right:0;bottom:3%;height:68%;z-index:6;touch-action:manipulation
  }
  .char-wrap > img,.char-wrap > svg{position:absolute;top:0;left:0;width:100%;height:100%;display:block}
  #char{object-fit:contain;-webkit-animation:bob 3.4s ease-in-out infinite;animation:bob 3.4s ease-in-out infinite;transform-origin:50% 92%}
  #char.chomping{animation:chomp .34s ease-in-out 4}
  #char.hop{animation:hop .62s ease-out}
  #char.wiggle{animation:wiggle .5s ease-in-out}

  .poops{position:absolute;top:0;right:0;bottom:0;left:0;z-index:5;pointer-events:none}
  .poop{position:absolute;bottom:6%;font-size:24px;line-height:1;transform:translateX(-50%);animation:popIn .35s ease-out}
  .poop .fly{position:absolute;top:-8px;left:4px;font-size:12px;animation:flyAround 1.6s linear infinite}
  .poop .stink{
    position:absolute;left:50%;top:-12px;width:8px;height:12px;border-radius:50%;
    border-left:2px solid rgba(120,170,90,.75);animation:stinkUp 2s ease-out infinite
  }
  .grass{position:absolute;top:0;right:0;bottom:0;left:0;z-index:8;pointer-events:none}
  .tuft{position:absolute;bottom:8%;font-size:22px;transform:translateX(-50%);cursor:pointer;pointer-events:auto;animation:popIn .3s ease-out}
  .tuft:active{transform:translateX(-50%) scale(.9)}
  .ball{position:absolute;right:8%;bottom:32%;font-size:30px;z-index:8;display:none;cursor:pointer;
        animation:bob 1.1s ease-in-out infinite}
  .ball.show{display:block}

  .bubble{
    position:absolute;left:50%;top:7%;transform:translateX(-50%);z-index:9;max-width:82%;
    padding:7px 13px;border:3px solid #3b2a20;border-radius:16px;background:#fff;
    font-size:13px;line-height:1.35;text-align:center;box-shadow:0 3px 0 rgba(59,42,32,.2);
    opacity:0;transition:opacity .2s;pointer-events:none
  }
  .bubble::after{
    content:"";position:absolute;left:50%;bottom:-11px;margin-left:-8px;border:8px solid transparent;
    border-top-color:#3b2a20
  }
  .bubble.show{opacity:1}
  .fx{position:absolute;top:0;right:0;bottom:0;left:0;z-index:8;pointer-events:none}
  .fx span{position:absolute;font-size:20px;animation:floatUp 1.1s ease-out forwards;pointer-events:none}
  .zzz{position:absolute;right:16%;top:12%;z-index:9;display:none;font-size:22px;color:#8b7fd8;font-weight:900}
  .zzz.on{display:block}
  .zzz span{display:block;animation:zzzFloat 2.4s ease-in-out infinite;opacity:0}
  .zzz span:nth-child(2){animation-delay:.5s;font-size:26px;margin-left:10px}
  .zzz span:nth-child(3){animation-delay:1s;font-size:30px;margin-left:20px}
  .night{position:absolute;top:0;right:0;bottom:0;left:0;background:radial-gradient(circle at 50% 40%,#141833,#05060f 90%);opacity:0;
         transition:opacity .6s;pointer-events:none;z-index:3}
  .night.on{opacity:.72}
  .hint{
    position:absolute;left:50%;bottom:2%;transform:translateX(-50%);z-index:10;background:rgba(255,255,255,.94);
    border:2.5px dashed #ff8fb8;border-radius:99px;padding:4px 12px;font-size:12px;opacity:0;transition:opacity .2s
  }
  .hint.on{opacity:1}

  /* ── 게이지 ────────────────────────────── */
  .stats{
    grid-area:stats;display:grid;grid-template-columns:1fr 1fr;grid-gap:4px 10px;gap:4px 10px;
    padding:6px 8px;border:3px solid #3b2a20;border-radius:16px;background:#fff9f2;
    box-shadow:0 3px 0 rgba(59,42,32,.18)
  }
  .stat{display:flex;align-items:center;min-width:0}
  .stat > * + *{margin-left:4px}
  .stat .ico{width:17px;height:17px;display:block;line-height:0;text-align:center;flex:0 0 auto}
  .stat .ico svg{width:17px;height:17px;display:block;margin:0 auto}
  .bar{position:relative;flex:1 1 auto;height:11px;border:2px solid #3b2a20;border-radius:99px;background:#ffeaf1;overflow:hidden}
  .bar i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:99px;transition:width .5s ease}
  .bar i::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,0) 60%)}
  .stat b{font-size:10px;min-width:17px;text-align:right;font-variant-numeric:tabular-nums;flex:0 0 auto}
  .stat.low .bar{animation:lowPulse 1.1s ease-in-out infinite}

  /* ── 아래 버튼 ─────────────────────────── */
  .dock{grid-area:dock;display:grid;grid-template-columns:repeat(5,1fr);grid-gap:5px;gap:5px}
  .dock-btn{
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5px 0 4px;
    border:3px solid #3b2a20;border-radius:15px;background:#fff;
    box-shadow:0 4px 0 #e77ba3,0 4px 0 3px rgba(59,42,32,.14);
    transition:transform .08s,background .2s
  }
  .dock-btn .ico{font-size:19px;line-height:1;height:22px;display:block}
  .dock-btn .ico svg{width:22px;height:22px;display:block}
  .dock-btn .lb{font-size:11px;line-height:1.2;margin-top:1px}
  .dock-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #e77ba3,0 1px 0 3px rgba(59,42,32,.14)}
  .dock-btn.active{background:#ffe4ee}
  .dock-btn.sleeping{background:#ded9ff}

  /* ── 패널 ──────────────────────────────── */
  .panel{
    grid-area:panel;position:relative;z-index:40;display:none;flex-direction:column;
    max-height:40vh;overflow:hidden;
    border:3px solid #3b2a20;border-radius:18px;background:#fffbf5;
    box-shadow:0 3px 0 rgba(59,42,32,.16),inset 0 0 0 4px rgba(255,255,255,.7)
  }
  @media (max-width:739px),(max-aspect-ratio:1/1){
    #app.panel-open{grid-template-areas:"hud" "stage" "panel" "stats" "dock";grid-template-rows:auto minmax(240px,1fr) auto auto auto}
    #app.panel-open .char-wrap{height:58%}
    #app.panel-open .bubble{top:3%}
  }
  #app.panel-open .panel{display:flex;animation:panelIn .22s ease-out}
  .panel-head{display:flex;align-items:center;justify-content:space-between;padding:6px 10px 4px;border-bottom:2.5px dashed #ffc1d8;flex:0 0 auto}
  .panel-head h2{margin:0;font-size:15px;letter-spacing:-.02em}
  .panel-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:9px 10px 12px;display:grid;grid-gap:8px;gap:8px}

  .sec-title{font-size:11px;color:#a1798c;letter-spacing:.02em;margin:2px 0 -2px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);grid-gap:7px;gap:7px}
  .grid2{display:grid;grid-template-columns:repeat(2,1fr);grid-gap:7px;gap:7px}
  .card{
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 3px;
    border:2.5px solid #3b2a20;border-radius:14px;background:#fff;box-shadow:0 3px 0 rgba(59,42,32,.14);
    text-align:center;line-height:1.15
  }
  .card > * + *{margin-top:1px}
  .card:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(59,42,32,.14)}
  .card .e{font-size:23px;line-height:1.1}
  .card .n{font-size:11px}
  .card .p{font-size:10px;color:#8a6a8a;font-weight:700}
  .card.on{background:#ffe6f0;box-shadow:0 0 0 3px #ff9ec4,0 3px 0 rgba(59,42,32,.14)}
  .card.locked{background:#fff7fa}
  .card.locked .e{opacity:.75}
  .big-btn{
    width:100%;padding:11px;border:3px solid #3b2a20;border-radius:15px;background:#ffd35c;
    font-size:14px;box-shadow:0 4px 0 #d9a92f
  }
  .big-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #d9a92f}
  .big-btn.blue{background:#a8dcff;box-shadow:0 4px 0 #6aa8d8}
  .big-btn.green{background:#b6ecc9;box-shadow:0 4px 0 #6cb98a}
  .tip{font-size:11px;color:#9a7b8b;text-align:center;line-height:1.35}
  .row{display:flex;align-items:center;justify-content:space-between;font-size:12px}
  .row > * + *{margin-left:8px}
  .pill{background:#ffe9f2;border:2px solid #3b2a20;border-radius:99px;padding:1px 9px;font-size:11px}

  /* ── 미니게임 ──────────────────────────── */
  .game{
    position:fixed;top:0;right:0;bottom:0;left:0;z-index:60;
    background:linear-gradient(#ffe8f2,#ffd2e5);display:none;flex-direction:column;padding:10px
  }
  @supports(padding-top:env(safe-area-inset-top)){
    .game{padding-top:calc(10px + env(safe-area-inset-top));padding-bottom:calc(10px + env(safe-area-inset-bottom))}
  }
  .game.on{display:flex}
  .game-bar{display:flex;align-items:center;justify-content:space-between;font-size:14px;margin-bottom:6px}
  .game-bar > * + *{margin-left:8px}
  .game-title{font-size:14px;color:#a1446c;white-space:nowrap}
  .game-bar .chip{background:#fff;border:2.5px solid #3b2a20;border-radius:99px;padding:2px 11px;box-shadow:0 2px 0 rgba(59,42,32,.18)}
  .arena{
    position:relative;flex:1 1 auto;border:3px solid #3b2a20;border-radius:16px;overflow:hidden;
    background:linear-gradient(#eef9ff,#d9eeff);box-shadow:inset 0 0 0 4px #fff;touch-action:none
  }
  .arena .drop{position:absolute;font-size:26px;transform:translate(-50%,-50%)}
  .arena .basket{
    position:absolute;bottom:1%;width:22%;height:19%;transform:translateX(-50%);
    display:flex;align-items:center;justify-content:center;font-size:38px;transition:left .06s linear
  }
  .game-foot{display:flex;margin-top:8px}
  .game-foot > * + *{margin-left:8px}
  .game-foot .btn{flex:1 1 auto;padding:9px;border:3px solid #3b2a20;border-radius:14px;background:#fff;box-shadow:0 3px 0 rgba(59,42,32,.2)}

  /* ── 토스트 ────────────────────────────── */
  .toast{
    position:fixed;left:50%;top:60px;transform:translateX(-50%);z-index:80;
    background:#3b2a20;color:#fff;padding:6px 15px;border-radius:99px;font-size:12.5px;
    opacity:0;transition:opacity .25s;pointer-events:none;box-shadow:0 3px 0 rgba(59,42,32,.25);max-width:86vw
  }
  @supports(top:env(safe-area-inset-top)){
    .toast{top:calc(60px + env(safe-area-inset-top))}
  }
  .toast.on{opacity:.94}

  /* ── 가로/태블릿 ───────────────────────── */
  @media (min-width:740px) and (min-aspect-ratio:1/1){
    #app{
      grid-template-columns:minmax(0,1fr) minmax(300px,360px);
      grid-template-rows:auto minmax(280px,1fr) auto auto;
      grid-template-areas:"hud panel" "stage panel" "stats panel" "dock panel";
      grid-gap:8px;gap:8px;padding:8px 10px
    }
    .panel{display:flex;grid-area:panel;max-height:none;height:100%;border:3px solid #3b2a20}
    #app.panel-open{
      grid-template-areas:"hud panel" "stage panel" "stats panel" "dock panel";
      grid-template-columns:minmax(0,1fr) minmax(300px,360px);
      grid-template-rows:auto minmax(280px,1fr) auto auto
    }
    .panel-head .round{display:none}
    .stats{grid-template-columns:repeat(4,1fr);grid-gap:8px;gap:8px}
    .char-wrap{bottom:2%;height:76%}
    .dock-btn{flex-direction:row;padding:7px 4px}
    .dock-btn .lb{font-size:12px;margin-top:0;margin-left:5px}
    .bubble{font-size:14px;top:5%}
  }
  @media (max-height:560px){
    #app{grid-template-rows:auto minmax(240px,1fr) auto auto}
    .char-wrap{bottom:1%;height:82%}
  }

  @keyframes panelIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-5px) rotate(-1deg)}}
  @keyframes hop{0%{transform:translateY(0) scale(1,1)}25%{transform:translateY(-30px) scale(.96,1.06)}
    55%{transform:translateY(0) scale(1.08,.92)}75%{transform:translateY(-8px) scale(.99,1.02)}
    100%{transform:translateY(0) scale(1,1)}}
  @keyframes chomp{0%,100%{transform:scale(1,1)}35%{transform:scale(1.07,.93)}70%{transform:scale(.95,1.05)}}
  @keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
  @keyframes popIn{0%{transform:translateX(-50%) scale(.2);opacity:0}70%{transform:translateX(-50%) scale(1.15);opacity:1}100%{transform:translateX(-50%) scale(1)}}
  @keyframes floatUp{0%{transform:translateY(0) scale(.7);opacity:1}100%{transform:translateY(-74px) scale(1.15);opacity:0}}
  @keyframes flyAround{0%{transform:translate(0,0)}25%{transform:translate(6px,-5px)}50%{transform:translate(-3px,-8px)}75%{transform:translate(5px,-3px)}100%{transform:translate(0,0)}}
  @keyframes stinkUp{0%{opacity:0;transform:translate(-50%,0) scale(.6)}40%{opacity:.9}100%{opacity:0;transform:translate(-50%,-18px) scale(1.2)}}
  @keyframes zzzFloat{0%{opacity:0;transform:translate(0,6px)}30%{opacity:1}100%{opacity:0;transform:translate(8px,-22px)}}
  @keyframes lowPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,120,150,0)}50%{box-shadow:0 0 0 3px rgba(255,120,150,.35)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>

/* ── 사운드 (Web Audio) ─────────────────────────────────── */
const Snd = {
  ctx: null, master: null,
  init(){
    if(this.ctx) { if(this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    try{
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.32;
      this.master.connect(this.ctx.destination);
    }catch(e){ this.ctx = null; }
  },
  tone(freq, dur, type, vol, delay, slideTo){
    if(S.muted || !this.ctx) return;
    const t0 = this.ctx.currentTime + (delay || 0);
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(40, slideTo), t0 + dur);
    const v = (vol == null ? .16 : vol);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(v, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.02);
  },
  noise(dur, vol, delay){
    if(S.muted || !this.ctx) return;
    const sr = this.ctx.sampleRate, len = Math.floor(sr * dur);
    const buf = this.ctx.createBuffer(1, len, sr), d = buf.getChannelData(0);
    for(let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = this.ctx.createBufferSource(), g = this.ctx.createGain();
    g.gain.value = vol == null ? .1 : vol;
    src.buffer = buf; src.connect(g); g.connect(this.master);
    src.start(this.ctx.currentTime + (delay || 0));
  },
  play(name){
    this.init();
    if(!this.ctx) return;
    switch(name){
      case 'tap':    this.tone(880, .07, 'sine', .12); break;
      case 'pop':    this.tone(660, .09, 'triangle', .14, 0, 990); break;
      case 'chomp':  this.tone(300, .07, 'square', .10); this.tone(220, .08, 'square', .10, .09);
                     this.noise(.06, .05, .02); break;
      case 'happy':  [523, 659, 784, 1047].forEach((f, i) => this.tone(f, .13, 'sine', .14, i * .07)); break;
      case 'coin':   this.tone(988, .06, 'square', .10); this.tone(1319, .11, 'square', .10, .06); break;
      case 'sparkle':[1568, 1319, 1760, 2093].forEach((f, i) => this.tone(f, .09, 'triangle', .08, i * .05)); break;
      case 'sweep':  this.noise(.28, .09); this.tone(420, .2, 'sine', .06, .04, 900); break;
      case 'bath':   this.noise(.35, .06); [880, 1175, 1568].forEach((f, i) => this.tone(f, .1, 'sine', .09, i * .09)); break;
      case 'sleep':  [523, 440, 349].forEach((f, i) => this.tone(f, .3, 'sine', .11, i * .18)); break;
      case 'wake':   [440, 554, 659, 880].forEach((f, i) => this.tone(f, .12, 'triangle', .11, i * .08)); break;
      case 'unlock': [523, 659, 784, 1047, 1319].forEach((f, i) => this.tone(f, .12, 'square', .09, i * .08)); break;
      case 'nope':   this.tone(220, .12, 'sawtooth', .08); this.tone(180, .16, 'sawtooth', .08, .12); break;
      case 'levelup':[659, 784, 988, 1319].forEach((f, i) => this.tone(f, .16, 'triangle', .13, i * .1)); break;
      case 'hop':    this.tone(440, .1, 'sine', .12, 0, 880); break;
      case 'pet':    this.tone(1046, .08, 'sine', .07); break;
      case 'catch':  this.tone(784, .06, 'square', .1, 0, 1046); break;
      case 'miss':   this.tone(196, .1, 'sine', .07); break;
    }
  }
};

const FACE_KEY = { ok:'basic', happy:'happy', love:'happy', surprise:'happy', sad:'sad', eat:'eat', sleep:'sleep' };
let curKey = 'basic';
function setFace(name){
  const key = FACE_KEY[name] || 'basic';
  if(key === curKey) return;
  curKey = key;
  el.char.src = CHARS[key];
}
function mood(){
  if(S.sleeping) return 'sleep';
  if(S.f < 28) return 'hungry';
  if(S.c < 32) return 'dirty';
  if(S.h < 28) return 'lonely';
  if(S.s < 20) return 'tired';
  return 'ok';
}
function applyMoodFace(){
  if(S.sleeping) { setFace('sleep'); return; }
  const m = mood();
  setFace(m === 'ok' ? 'ok' : 'sad');
  el.charWrap.classList.toggle('dirty', S.c < 45 || S.poops.length > 0);
  el.dirtLayer.setAttribute('opacity', S.c < 45 ? '1' : (S.poops.length ? '.6' : '0'));
}
let faceTimer = null;
function express(name, ms){
  setFace(name);
  clearTimeout(faceTimer);
  faceTimer = setTimeout(applyMoodFace, ms || 2200);
}

/* ── 옷/방 렌더 ─────────────────────────────────────────── */
function renderLook(){
  el.hatLayer.innerHTML = HAT_SVG[S.hat] || '';
  el.glassesLayer.style.display = S.outfit === 'glasses' ? '' : 'none';
  el.wandLayer.style.display   = S.outfit === 'wand' ? '' : 'none';
  el.scarfLayer.style.display  = S.outfit === 'scarf' ? '' : 'none';
  el.pajamaLayer.style.display = S.outfit === 'pajama' ? '' : 'none';
  el.capeLayer.style.display   = S.outfit === 'cape' ? '' : 'none';
  el.room.dataset.theme = S.room;
  renderDecos();
}
function renderDecos(){
  el.decos.innerHTML = '';
  const add = (txt, style, cls) => {
    const d = document.createElement('div');
    d.className = 'deco ' + (cls || '');
    d.textContent = txt;
    d.style.cssText = style;
    el.decos.appendChild(d);
  };
  if(S.room === 'basic'){
    add('🌿', 'left:3%;bottom:30%;font-size:30px');
    add('🧸', 'right:4%;bottom:27%;font-size:26px');
    add('🖼️', 'right:20%;top:12%;font-size:26px');
    add('🎀', 'left:43%;top:9%;font-size:18px', 'small');
    add('☁️', 'left:16%;top:22%;font-size:22px', 'small');
    add('📚', 'right:5%;bottom:33%;font-size:24px');
  }else if(S.room === 'flower'){
    add('🌻', 'left:5%;bottom:27%;font-size:30px');
    add('🌷', 'left:16%;bottom:24%;font-size:22px', 'small');
    add('🌼', 'right:12%;bottom:25%;font-size:26px');
    add('🌷', 'right:28%;bottom:29%;font-size:20px', 'small');
    add('🦋', 'left:70%;top:22%;font-size:20px', 'small');
    add('☀️', '', 'sun');
  }else if(S.room === 'night'){
    add('🌙', 'right:12%;top:10%;font-size:34px');
    add('⭐', 'left:18%;top:16%;font-size:16px', 'small');
    add('✨', 'left:34%;top:9%;font-size:15px', 'tiny');
    add('⭐', 'left:62%;top:24%;font-size:13px', 'tiny');
    add('✨', 'left:46%;top:20%;font-size:12px', 'tiny');
    add('⭐', 'right:28%;top:14%;font-size:11px', 'tiny');
    add('🌠', 'left:70%;top:8%;font-size:16px', 'tiny');
    add('⭐', 'left:8%;top:30%;font-size:11px', 'tiny');
  }else{
    add('🍓', 'left:8%;bottom:26%;font-size:26px');
    add('🍓', 'right:10%;bottom:28%;font-size:22px', 'small');
    add('🍓', 'left:60%;top:16%;font-size:16px', 'tiny');
    add('🍰', 'left:82%;top:24%;font-size:20px', 'small');
    add('🎀', 'left:26%;top:14%;font-size:18px', 'tiny');
  }
  el.window.style.display = (S.room === 'night') ? 'none' : '';
}

/* ── 게이지/HUD ─────────────────────────────────────────── */
function renderStats(){
  const set = (k, bar, val, stat) => {
    const v = Math.round(S[k]);
    bar.style.width = v + '%';
    val.textContent = v;
    stat.classList.toggle('low', v < 30);
  };
  set('f', el.barF, el.valF, el.statF);
  set('h', el.barH, el.valH, el.statH);
  set('c', el.barC, el.valC, el.statC);
  set('s', el.barS, el.valS, el.statS);
  el.barF.style.background = 'linear-gradient(90deg,#ffc27a,#ff9e4a)';
  el.barH.style.background = 'linear-gradient(90deg,#ffb0cd,#ff6fa5)';
  el.barC.style.background = 'linear-gradient(90deg,#9fd8ff,#5bb8f0)';
  el.barS.style.background = 'linear-gradient(90deg,#c3b4ff,#8f7ce8)';
}
function level(){ return 1 + Math.floor(S.xp / LV_STEP); }

/* ── 저장/시간 ──────────────────────────────────────────── */
let lastTick = Date.now();
function applyOffline(){
  const now = Date.now();
  const mins = clamp((now - (S.last || now)) / 60000, 0, 600);   // 최대 10시간
  if(mins > 1){
    const k = mins * 0.55;    // 오프라인은 일부만 반영
    S.f = clamp(S.f - 0.40 * k, FLOOR, 100);
    S.h = clamp(S.h - 0.30 * k, FLOOR, 100);
    S.c = clamp(S.c - 0.26 * k, FLOOR, 100);
    S.s = clamp(S.s - 0.22 * k, FLOOR, 100);
    S.poopMeter += mins * 0.5;
    while(S.poopMeter > 150 && S.poops.length < 3){ S.poops.push({
      id:'p' + Date.now() + Math.random().toString(36).slice(2,5), x: Math.round(rnd(20, 80)), y: Math.round(rnd(2, 10)) }); S.poopMeter -= 150; }
    S.last = now;
    if(mins > 3){
      setTimeout(()=>say(pick(['다녀왔어! 보고 싶었어~', '기다렸어! 같이 놀자~', '어! 왔구나~ 🐣'])), 700);
    }
  }
  S.last = now;
}
function tick(){
  const now = Date.now();
  const dt = clamp((now - lastTick) / 1000, 0, 90);
  lastTick = now;
  S.last = now;
  const m = dt / 60;                                  // 분 단위
  if(S.sleeping){
    S.s = clamp(S.s + 6.0 * m, 0, 100);
    S.f = clamp(S.f - 0.12 * m, FLOOR, 100);
    S.h = clamp(S.h - 0.08 * m, FLOOR, 100);
    S.poopMeter += dt * 0.10;
  }else{
    S.f = clamp(S.f - 0.40 * m, FLOOR, 100);
    S.h = clamp(S.h - 0.30 * m, FLOOR, 100);
    S.c = clamp(S.c - (0.20 + S.poops.length * 0.10) * m, FLOOR, 100);
    S.s = clamp(S.s - 0.22 * m, FLOOR, 100);
    S.poopMeter += dt * 1.0;
    if(S.poopMeter > 150){ S.poopMeter = 0; addPoop(); }
  }
  renderStats(); applyMoodFace(); renderSleep();
  if(S.sleeping && S.s >= 99.5){ /* 다 잤어요 */ }
  save();
}

function feed(id, fromEl){
  const food = FOODS.find(f => f.id === id);
  if(!food) return;
  if(S.sleeping){ say('자고 있어요… 자다가 먹으면 체해요!'); sfx('nope'); return; }
  if(S.f > 95){ say('배불러요~ 이따가 먹을게!'); sfx('nope'); return; }
  const wrapRect = el.charWrap.getBoundingClientRect();
  const start = fromEl ? fromEl.getBoundingClientRect() : null;
  if(start){
    const bit = document.createElement('div');
    bit.textContent = food.e;
    bit.style.cssText = 'position:fixed;z-index:70;font-size:26px;pointer-events:none;left:' +
      (start.left + start.width/2 - 13) + 'px;top:' + (start.top + start.height/2 - 13) + 'px';
    document.body.appendChild(bit);
    const tx = wrapRect.left + wrapRect.width * 0.5 - (start.left + start.width/2);
    const ty = wrapRect.top + wrapRect.height * 0.52 - (start.top + start.height/2);
    const anim = bit.animate(
      [{transform:'translate(0,0) scale(1)'},{transform:`translate(${tx*0.55}px,${ty-60}px) scale(1.15)`},
       {transform:`translate(${tx}px,${ty}px) scale(.55)`, opacity:.2}],
      {duration:560, easing:'cubic-bezier(.4,0,.5,1)'});
    anim.onfinish = ()=>bit.remove();
  }
  setTimeout(()=>{
    S.f = clamp(S.f + food.f, FLOOR, 100);
    S.h = clamp(S.h + food.h, FLOOR, 100);
    S.fed++;
    S.poopMeter += 45;
    el.char.classList.remove('chomping'); void el.char.offsetWidth; el.char.classList.add('chomping');
    express('eat', 1300);
    sfx('chomp');
    fx('💛', 50, 42, 2);
    setTimeout(()=>{ express('happy', 1500); fx(pick(['💕','✨','😋']), 50, 40, 2); }, 900);
    say(pick(['냠냠! 맛있어~', '우와~ 최고야!', '고마워! 배부르다~', '냠냠냠! 🍚']));
    addXp(2);
    renderStats(); save();
  }, 380);
}

/* ── 미니게임: 떨어지는 별사탕 받기 ─────────────────────── */
const G = { on:false, items:[], score:0, t:20, raf:0, spawnT:0, lastT:0, basketX:50 };
function startCatch(){
  G.on = true; G.items = []; G.score = 0; G.t = 20; G.basketX = 50; G.spawnT = 0;
  el.game.classList.add('on');
  el.gameScore.textContent = '0';
  el.gameTime.textContent = '20';
  el.basket.style.left = '50%';
  [...el.arena.querySelectorAll('.drop')].forEach(n => n.remove());
  G.lastT = performance.now();
  G.raf = requestAnimationFrame(catchFrame);
  say('떨어지는 별사탕을 바구니로 받아!');
}
function catchFrame(now){
  if(!G.on) return;
  const dt = Math.min((now - G.lastT) / 1000, .05);
  G.lastT = now;
  G.t -= dt;
  if(G.t <= 0){ endCatch(); return; }
  el.gameTime.textContent = Math.ceil(G.t);
  G.spawnT -= dt;
  if(G.spawnT <= 0){
    G.spawnT = Math.max(.32, .62 - (20 - G.t) * .012);
    const kind = Math.random() < .18 ? 'boom' : (Math.random() < .5 ? '🍬' : '🍓');
    const node = document.createElement('div');
    node.className = 'drop';
    node.textContent = kind === 'boom' ? '💣' : kind;
    node.style.left = rnd(8, 92) + '%';
    node.style.top = '-6%';
    el.arena.appendChild(node);
    G.items.push({ node, x: parseFloat(node.style.left), y: -6, v: rnd(38, 62), kind });
  }
  for(let i = G.items.length - 1; i >= 0; i--){
    const it = G.items[i];
    it.y += it.v * dt;
    it.node.style.top = it.y + '%';
    if(it.y > 88 && it.y < 102 && Math.abs(it.x - G.basketX) < 11){
      if(it.kind === 'boom'){ G.score = Math.max(0, G.score - 1); sfx('miss'); fxAt('💥', it.x, 86); }
      else { G.score++; sfx('catch'); fxAt('✨', it.x, 86); }
      el.gameScore.textContent = G.score;
      it.node.remove(); G.items.splice(i, 1); continue;
    }
    if(it.y > 104){ it.node.remove(); G.items.splice(i, 1); }
  }
  G.raf = requestAnimationFrame(catchFrame);
}
function fxAt(ch, x, y){
  const s = document.createElement('div');
  s.className = 'drop';
  s.textContent = ch;
  s.style.left = x + '%'; s.style.top = y + '%';
  s.animate([{opacity:1, transform:'translate(-50%,-50%) scale(.8)'},{opacity:0, transform:'translate(-50%,-50%) scale(1.5)'}],
    {duration:420});
  el.arena.appendChild(s);
  setTimeout(()=>s.remove(), 460);
}
function endCatch(){
  if(!G.on) return;
  G.on = false;
  cancelAnimationFrame(G.raf);
  G.items.forEach(it => it.node.remove());
  G.items = [];
  el.game.classList.remove('on');
  const sc = G.score;
  const candy = sc + (sc >= 8 ? 5 : 0);
  S.candy += candy;
  S.h = clamp(S.h + Math.min(20, sc * 2), FLOOR, 100);
  addXp(3 + Math.min(4, sc * .4));
  renderHud(); renderStats(); save();
  sfx(sc > 0 ? 'happy' : 'nope');
  setTimeout(()=>{ say(sc >= 8 ? `대단해! ${sc}개 받았어 (+🍬${candy})` : `별사탕 ${sc}개! (+🍬${candy})`); }, 260);
  toast('🍬 +' + candy);
}

el.arena.addEventListener('pointerdown', e => moveBasket(e));

function sweep(){
  if(S.sleeping){ say('쉿… 자고 있어요'); return; }
  if(!S.poops.length){ say('여기는 깨끗해~ ✨'); sfx('nope'); return; }
  const n = S.poops.length;
  S.poops.forEach((p, i)=>{
    const node = el.poops.querySelector('[data-id="' + p.id + '"]');
    if(node){
      node.animate([{transform:'translateX(-50%) scale(1) rotate(0)', opacity:1},
                    {transform:'translateX(-50%) scale(1.3) rotate(15deg)', opacity:1, offset:.5},
                    {transform:'translateX(-50%) scale(0) rotate(40deg)', opacity:0}],
                   {duration:420, delay:i * 130, fill:'forwards'});
    }
    fx('✨', parseFloat(p.x), 74, 1);
  });
  sfx('sweep');
  setTimeout(()=>{
    S.poops = [];
    S.c = clamp(S.c + 12 * n + 6, FLOOR, 100);
    S.cleaned++;
    addXp(3);
    renderPoops(); renderStats(); applyMoodFace(); save();
    sfx('sparkle');
    el.charWrap.classList.remove('dirty');
    fx('✨', 50, 70, 3); fx('🌟', 30, 78, 2); fx('✨', 70, 78, 2);
    say('반짝반짝! 깨끗해졌다 ✨');
    renderPanel();
  }, 380 + n * 130);
}
function bath(){
  if(S.sleeping){ say('자다가 목욕은 안 돼~'); return; }
  sfx('bath');
  fx('💧', 40, 60, 3); fx('💧', 60, 55, 3); fx('✨', 50, 45, 2);
  el.char.classList.remove('wiggle'); void el.char.offsetWidth; el.char.classList.add('wiggle');

/* ── 꾸미기 ─────────────────────────────────────────────── */
function ownedKey(cat, id){ return cat + ':' + id; }
function isOwned(cat, id){ return S.owned.indexOf(ownedKey(cat, id)) > -1; }
function equip(cat, id){
  const list = cat === 'hat' ? HATS : cat === 'outfit' ? OUTFITS : ROOMS;
  const item = list.find(x => x.id === id);
  if(!item) return;
  if(!isOwned(cat, id)){
    if(S.candy < item.price){
      sfx('nope');
      say('별사탕이 조금 더 필요해! 🍬');
      toast('🍬 ' + (item.price - S.candy) + '개 더 모아야 해요');
      return;
    }
    S.candy -= item.price;
    S.owned.push(ownedKey(cat, id));
    sfx('unlock');
    toast('🎉 ' + item.n + ' 해금!');
    addXp(2);
  }else{
    sfx('tap');
  }
  if(cat === 'hat') S.hat = id;
  else if(cat === 'outfit') S.outfit = id;
  else S.room = id;
  renderLook(); renderHud(); renderPanel(); save();
  if(cat === 'room') say(pick(['우와~ 방이 바뀌었어!', '여기 좋다! ✨']));
  else if(id !== 'none') say(pick(['어때? 잘 어울려?', '히히, 예쁘지~?', '새 옷이다! ✨']), 1800);
}

  }
  if(tab === 'dress'){
    const sec = (title, cat, list) => {
      let s = `<div class="sec-title">${title}</div><div class="grid3">`;
      list.forEach(it => {
        const own = isOwned(cat, it.id);
        const on = (cat === 'hat' ? S.hat : cat === 'outfit' ? S.outfit : S.room) === it.id;
        s += `<button class="card ${on ? 'on' : ''} ${own ? '' : 'locked'}" data-act="equip" data-cat="${cat}" data-id="${it.id}">
          <span class="e">${it.e}</span><span class="n">${it.n}</span>
          <span class="p">${own ? (on ? '입는 중' : '보유') : '🍬' + it.price}</span></button>`;
      });
      return s + '</div>';
    };
    html += sec('모자 · 머리띠', 'hat', HATS);
    html += sec('의상 · 소품', 'outfit', OUTFITS);
    html += sec('방 테마', 'room', ROOMS);
    html += `<div class="tip">가진 별사탕: 🍬 ${S.candy} — 놀아서 모아 보세요!</div>`;
  }
  el.panelBody.innerHTML = html;
}

/* ── 이벤트 ─────────────────────────────────────────────── */
el.dock.addEventListener('click', (e)=>{
  const b = e.target.closest('[data-tab]');
  if(!b) return;
  sfx('tap');
  if(b.dataset.tab === tab && el.panel.classList.contains('open') && !isLandscape()) closePanel();
  else openPanel(b.dataset.tab);
});
function isLandscape(){
  return window.matchMedia('(min-width:740px) and (min-aspect-ratio:1/1)').matches;
}
el.panelClose.addEventListener('click', ()=>{ sfx('tap'); closePanel(); });
el.btnSleep.addEventListener('click', ()=>{ toggleSleep(); });

el.panelBody.addEventListener('click', (e)=>{
  const b = e.target.closest('[data-act]');
  if(!b || b.disabled) return;
  const act = b.dataset.act;
  if(act === 'feed') feed(b.dataset.id, b);
  else if(act === 'pet'){ startPet(); }
  else if(act === 'ball'){ startBall(); }
  else if(act === 'grass'){ startGrass(); }
  else if(act === 'catch'){ startCatch(); }
  else if(act === 'sweep'){ sweep(); }
  else if(act === 'bath'){ bath(); }
  else if(act === 'equip'){ equip(b.dataset.cat, b.dataset.id); }
});

el.ball.addEventListener('click', hitBall);

/* 캐릭터 터치 */
el.charWrap.addEventListener('pointerdown', ()=>{
  Snd.init();
  if(e_pointerDownBlocked) return;
  if(S.sleeping){ say('쿨쿨… 자는 중이야 💤', 1600); return; }
  if(pet.on){ doPet(); return; }
  S.h = clamp(S.h + .3, FLOOR, 100);
  express('happy', 1200);
  say(pick(['히히!', '간지러워~', '또 놀자!', '쓰다듬어 줘~']), 1400);
  sfx('tap');
  renderStats(); save();
});
let e_pointerDownBlocked = false;
el.charWrap.addEventListener('pointermove', ()=>{
  if(!pet.on) return;
  doPet();
});
el.charWrap.addEventListener('pointerup', ()=>{});
el.char.addEventListener('animationend', ()=>{ el.char.classList.remove('chomping','hop','wiggle'); });

/* 소리 */
el.btnSound.addEventListener('click', ()=>{
  S.muted = !S.muted;
  renderSound(); save();
  if(!S.muted){ Snd.init(); sfx('pop'); }
});
function renderSound(){
  el.btnSound.textContent = S.muted ? '🔇' : '🔊';
  el.btnSound.classList.toggle('muted', !!S.muted);
}

/* 첫 터치에서 오디오 열기 */
['pointerdown','keydown'].forEach(ev => window.addEventListener(ev, ()=>Snd.init(), { once:true }));

/* 화면 전환/가림 */
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden){ S.last = Date.now(); save(Date.now() + 999); }
  else { applyOffline(); renderAll(); lastTick = Date.now(); }
});
window.addEventListener('pagehide', ()=>{ S.last = Date.now(); try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} });
window.addEventListener('orientationchange', ()=>{ setTimeout(()=>{ if(!isLandscape() && !el.panel.classList.contains('open')) {} }, 300); });

/* 반응형: 가로모드면 패널 고정 → 열린 상태 유지 */
function onResize(){
  if(isLandscape()){
    el.panel.classList.add('open');
    document.getElementById('app').classList.add('panel-open');
    renderPanel();
  }else{
    closePanel();
  }
}
window.addEventListener('resize', onResize);

/* ── 시작 ───────────────────────────────────────────────── */
function boot(){
  const had = load();
  applyOffline();
  if(!had) S.last = Date.now();
  lastTick = Date.now();
  renderAll();
  renderSound();
  setFace('ok');
  if(isLandscape()){ openPanel('food'); } else { closePanel(); }
  if(!had){
    setTimeout(()=>say('안녕! 나는 치이카와야 🐣 같이 놀자~'), 600);
    setTimeout(()=>{ S.candy += 0; renderHud(); }, 100);
  }
  setInterval(tick, 1000);
  /* 가끔 말 걸기 */
  setInterval(()=>{
    if(document.hidden || el.bubble.classList.contains('show')) return;
    const m = mood();
    if(m === 'hungry') say(pick(['배고파요~ 밥 주세요! 🍙', '꼬르륵… 배가 고파']));
    else if(m === 'dirty') say(pick(['몸이 지저분해… 씻겨 줄래?', '똥 냄새가 나… 💧']));
    else if(m === 'lonely') say(pick(['심심해~ 같이 놀자!', '쓰다듬어 줘~ 🤲']));
    else if(m === 'tired') say(pick(['졸려… 재워 줄래? 😴', '하아암…']));
    else say(pick(['오늘도 즐거워!', '별사탕 모으자! 🍬', '히히~ 기분 좋아', '우리 같이 놀자~ 🎾']));
  }, 21000);
}

/* 테스트/디버그용 최소 인터페이스 */
window.tama = {
  get state(){ return JSON.parse(JSON.stringify(S)); },
  set(patch){ Object.assign(S, patch); renderAll(); save(Date.now() + 999); },
  feed, sweep, bath, toggleSleep, startBall, startGrass, startCatch, startPet, equip, openPanel, closePanel,
  addPoop, tick, hitBall, endCatch, pick, setFace, express,
  get level(){ return level(); }
};

/* 화면 실제 높이로 앱 크기 고정 — 구형 크롬 주소창 때문에 아래 버튼이 가려지지 않게 */
function fitApp(){
  var h = window.innerHeight || document.documentElement.clientHeight || 0;
  var a = document.getElementById('app');
  if(h > 200 && a) a.style.height = h + 'px';
}
window.addEventListener('resize', fitApp);
window.addEventListener('orientationchange', function(){ setTimeout(fitApp, 250); });
fitApp();

boot();
})();
</script>
</body>
</html>
