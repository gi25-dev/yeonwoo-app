<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="연우 공부방">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6efe4">
<title>연우 공부 패드</title>
<style>:root {
  --cream: #f6efe4;
  --cream-deep: #ece1d1;
  --paper: #fffdf8;
  --ink: #2a231c;
  --ink-soft: #6f6357;
  --line: #e4d8c6;
  --accent: #e8613c;
  --accent-soft: #fde9e2;
  --blue: #2f6feb;
  --green: #17936a;
  --shadow: 0 8px 20px rgba(90, 65, 40, .10), 0 2px 5px rgba(90, 65, 40, .07);
  --radius: 18px;
  --hdr: 58px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", system-ui, sans-serif;
  background: var(--cream);
  color: var(--ink);
  overscroll-behavior: none;
  -webkit-text-size-adjust: 100%;
  font-size: 16px;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
button:active { transform: translateY(1px); }
input, select { font: inherit; color: inherit; }

#app { height: 100%; height: 100dvh; display: flex; flex-direction: column; }
.view { flex: 1; display: none; flex-direction: column; min-height: 0; }
.view.active { display: flex; }

/* ---------- shelf ---------- */
.topbar {
  height: var(--hdr);
  padding: var(--safe-t) 16px 0;
  display: flex; align-items: center; gap: 10px;
  background: linear-gradient(180deg, #fffaf2, #f8f1e6);
  border-bottom: 1px solid var(--line);
  flex: none;
}
.topbar .brand { font-size: 19px; font-weight: 800; letter-spacing: -.4px; margin-right: auto;
  display: flex; align-items: center; gap: 8px; }
.topbar .brand small { font-weight: 600; font-size: 12px; color: var(--ink-soft); letter-spacing: 0; }
.btn-soft {
  background: #fff; border: 1px solid var(--line); border-radius: 999px;
  padding: 7px 13px; font-size: 13.5px; font-weight: 700; color: var(--ink-soft);
  box-shadow: 0 1px 2px rgba(90, 65, 40, .06); white-space: nowrap;
}
.btn-soft.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn-soft:disabled { opacity: .45; }

.shelf-scroll { flex: 1; overflow-y: auto; padding: 10px 16px calc(24px + var(--safe-b)); -webkit-overflow-scrolling: touch; }
.subject { display: grid; grid-template-columns: 62px 1fr; column-gap: 10px; align-items: start; margin-bottom: 12px; }
.subject-head { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; margin: 0; padding-top: 6px; }
.subject-head h2 { margin: 0; font-size: 15px; line-height: 1.25; font-weight: 800; letter-spacing: -.3px; }
.subject-head .sub-count { font-size: 12px; color: var(--ink-soft); font-weight: 600; }
.subject-head .del-subject { margin: 4px 0 0; font-size: 11px; color: #b9a996; }

.cat { margin: 0 0 14px; }
.ctag { position: absolute; left: 7px; top: 7px; font-size: 10px; font-weight: 800; letter-spacing: .02em;
  color: #fff; background: rgba(28, 22, 17, .55); padding: 2px 7px; border-radius: 7px; backdrop-filter: blur(3px); }
.cat-name {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12.5px; font-weight: 800; color: #907c66;
  letter-spacing: .02em; margin-bottom: 8px;
}
.cat-name::before { content: ""; width: 14px; height: 2px; border-radius: 2px; background: #d9c9b4; }

.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); }

.book {
  position: relative; display: flex; flex-direction: column; gap: 6px;
  padding: 0; text-align: left; border-radius: var(--radius);
}
.cover {
  position: relative; width: 100%; aspect-ratio: 3 / 4; border-radius: 14px;
  overflow: hidden; background: #fff; box-shadow: var(--shadow);
  border: 1px solid rgba(120, 95, 65, .10);
}
.cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cover.plain { display: flex; align-items: center; justify-content: center; padding: 12px; }
.cover.plain .ct { font-size: 15px; font-weight: 800; line-height: 1.28; letter-spacing: -.4px; text-align: center; }
.cover.plain .ce { position: absolute; right: 9px; top: 8px; font-size: 20px; opacity: .9; }
.cover.plain::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(150deg, rgba(255,255,255,.32), rgba(0,0,0,.04) 55%, rgba(0,0,0,.14));
}
.cover .spine {
  position: absolute; left: 0; top: 0; bottom: 0; width: 7px;
  background: linear-gradient(90deg, rgba(0,0,0,.22), rgba(255,255,255,.14));
}
.badge {
  position: absolute; right: 8px; bottom: 8px;
  background: rgba(24, 20, 16, .72); color: #fff; border-radius: 999px;
  font-size: 11px; font-weight: 800; padding: 3px 8px; backdrop-filter: blur(4px);
}
.badge.done { background: rgba(23, 147, 106, .92); }
.book-title { font-size: 13px; font-weight: 800; letter-spacing: -.3px; line-height: 1.25; }
.book-sub { display: none; font-size: 10.5px; color: var(--ink-soft); font-weight: 600; margin-top: 1px; line-height: 1.3;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.book .mini-del {
  position: absolute; right: -4px; top: -4px; width: 24px; height: 24px; border-radius: 50%;
  background: #fff; border: 1px solid var(--line); box-shadow: var(--shadow);
  font-size: 13px; display: none; align-items: center; justify-content: center;
}
body.editing .book.custom .mini-del { display: flex; }
.empty-note { font-size: 12.5px; color: #a4937f; padding: 2px 2px 6px; }

/* ---------- book detail ---------- */
.header-lite {
  height: var(--hdr); padding: var(--safe-t) 12px 0; flex: none;
  display: flex; align-items: center; gap: 10px;
  background: #fffaf2; border-bottom: 1px solid var(--line);
}
.icon-btn {
  width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center;
  font-size: 18px; background: #fff; border: 1px solid var(--line); flex: none;
}
.icon-btn.ghost { background: transparent; border-color: transparent; }
.header-lite .ht { font-size: 15px; font-weight: 800; letter-spacing: -.3px; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; }
.header-lite .hs { font-size: 11.5px; color: var(--ink-soft); font-weight: 600; }
.header-lite .spacer { flex: 1; }

.book-scroll { flex: 1; overflow-y: auto; padding: 16px 16px calc(28px + var(--safe-b)); }
#bookBody { max-width: 760px; width: 100%; margin: 0 auto; }
.book-hero { display: flex; gap: 14px; align-items: center; margin-bottom: 16px; }
.book-hero .cover { width: 96px; flex: none; }
.book-hero h1 { margin: 0 0 4px; font-size: 20px; font-weight: 850; letter-spacing: -.6px; }
.book-hero .hs2 { font-size: 12.5px; color: var(--ink-soft); font-weight: 600; margin-bottom: 8px; }
.progress-wrap { display: flex; align-items: center; gap: 8px; font-size: 11.5px; font-weight: 700; color: var(--ink-soft); }
.bar { flex: 1; height: 7px; border-radius: 99px; background: #e9dfd0; overflow: hidden; max-width: 190px; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, #f7a072, var(--accent)); border-radius: 99px; }

.unit-list { display: flex; flex-direction: column; gap: 10px; list-style: none; margin: 0; padding: 0; }
.unit-card {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 13px 14px;
  box-shadow: 0 2px 6px rgba(90, 65, 40, .05);
}
.unit-card .uicon { font-size: 20px; width: 34px; text-align: center; flex: none; }
.unit-card .ut { font-size: 14.5px; font-weight: 800; letter-spacing: -.3px; line-height: 1.3; }
.unit-card .us { font-size: 11.5px; color: var(--ink-soft); font-weight: 600; margin-top: 3px; }
.unit-card .ring { margin-left: auto; flex: none; font-size: 11.5px; font-weight: 800; color: var(--accent);
  background: var(--accent-soft); border-radius: 999px; padding: 5px 10px; }
.unit-card .ring.full { color: var(--green); background: #e6f6ef; }

.add-row { margin-top: 14px; display: flex; gap: 9px; flex-wrap: wrap; }
.dashed {
  flex: 1; min-width: 180px; border: 1.6px dashed #d3c3ad; border-radius: 16px; padding: 15px;
  font-size: 13.5px; font-weight: 800; color: #a58f76; background: rgba(255,255,255,.5);
}
.page-list { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.page-row { display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid var(--line);
  border-radius: 13px; padding: 9px 12px; font-size: 13px; font-weight: 700; }
.page-row .pl { color: var(--ink-soft); font-weight: 700; font-size: 12px; min-width: 44px; }
.page-row .pg-done { color: var(--green); font-size: 12.5px; font-weight: 800; margin-left: auto; }
.page-row .pg-del { color: #c9b6a1; font-size: 14px; padding: 2px 4px; }

/* ---------- pad ---------- */
.pad-top {
  height: var(--hdr); flex: none; padding: var(--safe-t) 10px 0;
  display: flex; align-items: center; gap: 8px;
  background: #fffaf2; border-bottom: 1px solid var(--line);
}
.pad-top .pt { font-size: 13.5px; font-weight: 800; letter-spacing: -.3px; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; }
.pad-top .ps { font-size: 11px; color: var(--ink-soft); font-weight: 600; }
.done-btn {
  margin-left: auto; flex: none; border-radius: 999px; padding: 8px 13px; font-size: 12.5px; font-weight: 800;
  background: #fff; border: 1.5px solid #d9cbb8; color: #8b7a66; white-space: nowrap;
}
.done-btn.on { background: var(--green); border-color: var(--green); color: #fff; }

.tools {
  flex: none; display: flex; align-items: center; gap: 6px; padding: 7px 10px;
  background: #fffdf9; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none;
}
.tools::-webkit-scrollbar { display: none; }
.tool {
  width: 40px; height: 40px; border-radius: 12px; font-size: 18px; flex: none;
  display: grid; place-items: center; background: #f4ece0; border: 1.5px solid transparent;
}
.tool.on { background: #fff; border-color: var(--accent); box-shadow: 0 2px 8px rgba(232, 97, 60, .18); }
.swatches { display: flex; gap: 6px; align-items: center; padding: 0 4px; }
.sw { width: 26px; height: 26px; border-radius: 50%; border: 2.5px solid #fff;
  box-shadow: 0 0 0 1.4px #dccfbd; flex: none; }
.sw.on { box-shadow: 0 0 0 2.6px var(--ink); }
.dots { display: flex; gap: 3px; align-items: center; padding: 0 3px; }
.dot-btn { width: 30px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: #f4ece0; }
.dot-btn.on { background: #fff; box-shadow: inset 0 0 0 1.5px var(--accent); }
.dot { background: #3b3128; border-radius: 50%; }
.sep { width: 1px; height: 26px; background: var(--line); margin: 0 3px; flex: none; }

.stage {
  flex: 1; min-height: 0; overflow: auto; padding: 12px; display: flex;
  background:
    radial-gradient(circle at 20% 0%, #fff9f0, transparent 60%),
    #efe6d8;
  -webkit-overflow-scrolling: touch;
  justify-content: center; align-items: flex-start;
}
.paper {
  position: relative; background: #fff; border-radius: 10px; flex: none;
  box-shadow: 0 12px 30px rgba(80, 55, 30, .18), 0 2px 6px rgba(80, 55, 30, .12);
  overflow: hidden; margin: auto;
}
.paper img { width: 100%; height: 100%; display: block; user-select: none; -webkit-user-drag: none; pointer-events: none; }
.paper, .paper canvas { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
.paper canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.paper.pen-only canvas { touch-action: pan-x pan-y; }
.paper .loading { position: absolute; inset: 0; display: grid; place-items: center; color: #b7a48d;
  font-size: 13px; font-weight: 700; }

.pad-bottom {
  flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 12px calc(8px + var(--safe-b));
  background: #fffaf2; border-top: 1px solid var(--line);
}
.nav-btn { border-radius: 12px; padding: 9px 13px; font-size: 13px; font-weight: 800; background: #fff;
  border: 1px solid var(--line); color: var(--ink-soft); white-space: nowrap; }
.nav-btn:disabled { opacity: .35; }
.pageno { font-size: 13px; font-weight: 800; min-width: 58px; text-align: center; }
.pad-bottom .spacer { flex: 1; }
.narrow { display: none; }
.chip { border-radius: 999px; padding: 8px 12px; font-size: 12.5px; font-weight: 800; background: #fff;
  border: 1px solid var(--line); color: var(--ink-soft); white-space: nowrap; }
.chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }

/* ---------- modal ---------- */
.modal-back {
  position: fixed; inset: 0; background: rgba(40, 30, 22, .42); backdrop-filter: blur(3px);
  display: none; align-items: center; justify-content: center; padding: 18px; z-index: 40;
}
.modal-back.show { display: flex; }
.modal {
  width: min(430px, 100%); max-height: 86vh; overflow-y: auto; background: #fffdf9;
  border-radius: 22px; padding: 20px; box-shadow: 0 24px 60px rgba(50, 35, 20, .32);
}
.modal h3 { margin: 0 0 14px; font-size: 17px; font-weight: 850; letter-spacing: -.4px; }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12px; font-weight: 800; color: #8b7a66; margin-bottom: 5px; }
.field input[type=text], .field select {
  width: 100%; padding: 11px 12px; border-radius: 12px; border: 1.5px solid var(--line);
  background: #fff; font-size: 14.5px; font-weight: 600;
}
.field input:focus, .field select:focus { outline: none; border-color: var(--accent); }
.color-row { display: flex; gap: 9px; flex-wrap: wrap; }
.color-pick { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 1.5px #ddd0bd; }
.color-pick.on { box-shadow: 0 0 0 3px var(--ink); }
.file-btn {
  display: block; width: 100%; text-align: center; padding: 12px; border-radius: 12px;
  border: 1.6px dashed #d3c3ad; color: #a58f76; font-weight: 800; font-size: 13px; background: #fff;
}
.modal-actions { display: flex; gap: 9px; margin-top: 16px; }
.modal-actions button { flex: 1; padding: 12px; border-radius: 13px; font-weight: 800; font-size: 14px; }
.modal-actions .cancel { background: #f1e8db; color: #7d6c59; }
.modal-actions .ok { background: var(--accent); color: #fff; }
.modal-actions .ok.danger { background: #d93a2b; }
.hint { font-size: 12px; color: #9b8a76; line-height: 1.45; margin-top: 8px; }

.toast {
  position: fixed; left: 50%; bottom: calc(74px + var(--safe-b)); transform: translateX(-50%) translateY(14px);
  background: rgba(35, 27, 20, .92); color: #fff; padding: 10px 16px; border-radius: 999px;
  font-size: 13px; font-weight: 700; opacity: 0; transition: .22s; pointer-events: none; z-index: 60;
  max-width: 86vw; text-align: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.tip {
  margin: 0 0 14px; padding: 11px 13px; border-radius: 14px; background: #fff6e8;
  border: 1px solid #f0ddc2; font-size: 12.5px; font-weight: 650; color: #8a7457;
  display: flex; gap: 8px; align-items: flex-start; line-height: 1.5;
}
.tip b { color: #6b5537; }
.tip .x { margin-left: auto; color: #b7a48d; font-weight: 800; flex: none; }

@media (max-width: 520px) {
  .subject { display: block; }
  .subject-head { flex-direction: row; align-items: baseline; gap: 8px; margin: 0 2px 7px; padding-top: 0; }
  .tools { flex-wrap: wrap; row-gap: 5px; }
  .tools .sep { display: none; }
  .nav-btn .lbl { display: none; }
  .wide { display: none; }
  .narrow { display: inline; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 11px; }
  .book-title { font-size: 12.5px; }
  .book-sub { display: none; font-size: 10.5px; }
  .topbar .brand small { display: none; }
  .tools { padding: 6px 8px; gap: 5px; }
  .tool { width: 36px; height: 36px; font-size: 16px; }
  .sw { width: 23px; height: 23px; }
  .dot-btn { width: 27px; }
  .pad-bottom { gap: 6px; padding: 7px 8px calc(7px + var(--safe-b)); }
  .nav-btn { padding: 8px 10px; font-size: 12px; }
  .chip { padding: 7px 10px; font-size: 11.5px; }
  .stage { padding: 8px; }
}

/* ======================= 디지털 학습지 (국어·수학) ======================= */
#view-digital { position: relative; background: #f7f1e7; }

.dg-top {
  height: var(--hdr); flex: none; padding: var(--safe-t) 12px 0;
  display: flex; align-items: center; gap: 9px;
  background: #fffaf2; border-bottom: 1px solid var(--line);
}
.dg-top .dg-tt { min-width: 0; }
.dg-top .dgt { font-size: 14.5px; font-weight: 800; letter-spacing: -.3px; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; }
.dg-top .dgs { font-size: 11.5px; color: var(--ink-soft); font-weight: 600; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; }
.dg-spacer { flex: 1; }
.dg-prog { font-size: 12.5px; font-weight: 800; color: var(--accent); background: var(--accent-soft);
  border-radius: 999px; padding: 5px 10px; white-space: nowrap; }
.chip.dg-ico { padding: 8px 10px; }
.chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.chip.mini { padding: 5px 9px; font-size: 11.5px; }

.dg-body { flex: 1; min-height: 0; display: flex; overflow: hidden; }
.dg-loading { flex: 1; display: grid; place-items: center; color: #b7a48d; font-weight: 700; font-size: 14px; }

/* ---------- 국어: 2단 ---------- */
.dg-body.kor { display: grid; grid-template-columns: minmax(0, 46%) minmax(0, 54%); }
.dg-left { display: flex; flex-direction: column; min-height: 0; min-width: 0;
  border-right: 1px solid var(--line); background: #f3ebdd; }
.dg-lhead { flex: none; display: flex; align-items: center; gap: 5px; padding: 6px 9px;
  background: #fffdf8; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.dg-lhead::-webkit-scrollbar { display: none; }
.dg-lhead .lt { font-size: 12px; font-weight: 800; color: #7d6c59; margin-right: auto; white-space: nowrap; }
.ptool { width: 34px; height: 34px; border-radius: 10px; font-size: 16px; flex: none;
  display: grid; place-items: center; background: #f4ece0; border: 1.5px solid transparent; }
.ptool.on { background: #fff; border-color: var(--accent); box-shadow: 0 2px 8px rgba(232, 97, 60, .16); }

.dg-lscroll { flex: 1; overflow: auto; padding: 10px; -webkit-overflow-scrolling: touch; }
.dg-paper { position: relative; background: #fff; border-radius: 14px; padding: 20px 22px 28px 30px;
  box-shadow: 0 10px 26px rgba(90, 65, 40, .13), 0 2px 6px rgba(90, 65, 40, .07);
  font-size: 19px; line-height: 1.92; letter-spacing: -.25px; color: #241e18; }
.dg-ptitle { font-size: 23px; font-weight: 850; letter-spacing: -.7px; margin-bottom: 3px; }
.dg-pauthor { font-size: 12px; color: #9a8a76; font-weight: 700; margin-bottom: 16px; letter-spacing: .1em; }
.dgpar { position: relative; margin: 0 0 13px; }
.pnum { position: absolute; left: -17px; top: 8px; font-size: 9.5px; font-weight: 800; color: #cdbda6;
  letter-spacing: 0; line-height: 1; }
.dgpar:last-child { margin-bottom: 0; }
.pmk { display: inline-block; color: #c8452c; font-weight: 800; }
.dgbrk { text-align: center; color: #a4937f; font-weight: 800; letter-spacing: .18em; margin: 16px 0; font-size: 15px; }
mark.dghl { background: linear-gradient(180deg, rgba(255, 225, 77, 0) 40%, rgba(255, 225, 77, .85) 40%,
  rgba(255, 225, 77, .85) 94%, rgba(255, 225, 77, 0) 94%); color: inherit; padding: 0; }
.dgw { border-bottom: 2px dotted #e0713c; cursor: pointer; }
.dgpar.reading { background: #fff6d9; border-radius: 8px; box-shadow: 0 0 0 5px #fff6d9; }
.dg-pen { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; touch-action: none; }
.dg-paper.penmode { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.dg-paper.penmode .dgpar { -webkit-user-select: none; user-select: none; }

.dg-right { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.dg-tabs { flex: none; display: flex; gap: 6px; padding: 8px 10px; background: #fffdf8;
  border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.dg-tabs::-webkit-scrollbar { display: none; }
.dg-tab { border-radius: 999px; padding: 7px 12px; font-size: 12.5px; font-weight: 800;
  background: #f2e9dc; color: #8b7a66; white-space: nowrap; }
.dg-tab small { font-size: 10.5px; opacity: .7; font-weight: 700; }
.dg-tab.on { background: var(--ink); color: #fff; }
.dg-tab.full::after { content: " ✓"; color: #19a273; }
.dg-tab.on.full::after { color: #9cf0c9; }

<script>/* 연우 공부 패드 — 학습지 필기 앱 */
(function () {
  'use strict';

  /* ------------------------------------------------------------------ utils */
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const uid = (p) => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const assetUrl = (p) => (window.__ASSET_MAP__ && window.__ASSET_MAP__[p]) || ('assets/' + p);

  function toast(msg, ms = 1800) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => t.classList.remove('show'), ms);
  }

  /* --------------------------------------------------------------- indexedDB */
  const DB_NAME = 'yeonwoo-study-pad';
  const DB_VER = 1;
  let _db = null;

  function db() {
    if (_db) return Promise.resolve(_db);
    return new Promise((res, rej) => {
      const req = indexedDB.open(DB_NAME, DB_VER);
      req.onupgradeneeded = () => {
        const d = req.result;
        if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta', { keyPath: 'k' });
        if (!d.objectStoreNames.contains('ink')) d.createObjectStore('ink', { keyPath: 'k' });
        if (!d.objectStoreNames.contains('blobs')) d.createObjectStore('blobs', { keyPath: 'k' });
      };
      req.onsuccess = () => { _db = req.result; res(_db); };
      req.onerror = () => rej(req.error);
    });
  }

  let LS_MODE = false;   // fallback when IndexedDB is unavailable (e.g. file:// on some browsers)
  const lsKey = (store, key) => 'ysp:' + store + ':' + key;

  function blobToDataUrl(blob) {
    return new Promise((res) => {
      const fr = new FileReader();
      fr.onload = () => res(fr.result);
      fr.onerror = () => res('');
      fr.readAsDataURL(blob);
    });
  }

  async function idbGet(store, key) {
    if (LS_MODE) {
      try { const v = localStorage.getItem(lsKey(store, key)); return v ? JSON.parse(v) : null; }
      catch (e) { return null; }
    }
    try {
      const d = await db();
      return await new Promise((res, rej) => {
        const tx = d.transaction(store, 'readonly');
        const r = tx.objectStore(store).get(key);
        r.onsuccess = () => res(r.result || null);
        r.onerror = () => rej(r.error);
      });
    } catch (e) { LS_MODE = true; return idbGet(store, key); }
  }

  async function idbPut(store, val) {
    if (LS_MODE) {
      let v = val;
      if (store === 'blobs' && val.blob) v = { k: val.k, url: await blobToDataUrl(val.blob) };
      try { localStorage.setItem(lsKey(store, val.k), JSON.stringify(v)); } catch (e) { console.warn('저장 공간이 가득 찼어요', e); }
      return true;
    }
    try {
      const d = await db();
      return await new Promise((res, rej) => {
        const tx = d.transaction(store, 'readwrite');
        tx.objectStore(store).put(val);
        tx.oncomplete = () => res(true);
        tx.onerror = () => rej(tx.error);
      });
    } catch (e) { LS_MODE = true; return idbPut(store, val); }
  }

  async function idbDel(store, key) {
    if (LS_MODE) { try { localStorage.removeItem(lsKey(store, key)); } catch (e) {} return true; }
    try {
      const d = await db();
      return await new Promise((res, rej) => {
        const tx = d.transaction(store, 'readwrite');
        tx.objectStore(store).delete(key);
        tx.oncomplete = () => res(true);
        tx.onerror = () => rej(tx.error);
      });
    } catch (e) { LS_MODE = true; return idbDel(store, key); }
  }

  /* ------------------------------------------------------------------ state */
  const S = {
    lib: null,
    done: {},          // pageKey -> true
    view: 'shelf',
    bookId: null,
    unitId: null,
    pageIdx: 0,
    pageKey: null,
    strokes: [],
    redo: [],
    tool: 'pen',
    penColor: '#22201d',
    hlColor: '#ffe14d',
    penW: 1,
    hlW: 1,
    erW: 1,
    zoom: false,
    penOnly: localStorage.getItem('ysp-penOnly') !== '0',
    imgAR: 0.75,
    ready: false,
    objectUrls: {},
    pan: null,
    active: new Set(),
    cur: null,
    saveTimer: 0
  };

  const PEN_COLORS = ['#22201d', '#e23b3b', '#2563eb', '#1a9c62'];
  const HL_COLORS = ['#ffe14d', '#ff9ecb', '#8ef0cd'];
  const PEN_W = [0.0038, 0.0072, 0.0125];   // normalized to page width
  const HL_W = [0.022, 0.032, 0.046];
  const ER_W = [0.026, 0.045, 0.075];

  const widthArr = (tool) => (tool === 'hl' ? HL_W : tool === 'eraser' ? ER_W : PEN_W);
  const widthIdx = () => (S.tool === 'hl' ? S.hlW : S.tool === 'eraser' ? S.erW : S.penW);
  const curWidth = () => widthArr(S.tool)[widthIdx()];
  const curColor = () => (S.tool === 'hl' ? S.hlColor : S.tool === 'eraser' ? '#000' : S.penColor);
  const pageKey = (b, u, p) => b + '|' + u + '|' + p;

  /* ---------------------------------------------------------------- library */
  function seedLibrary() {
    const lib = JSON.parse(JSON.stringify(window.__DATA__));
    let n = 0;
    lib.subjects.forEach((s) => {
      s.custom = false;
      s.categories.forEach((c) => {
        c.books.forEach((b) => {
          b.custom = false; b.id = b.id || uid('b'); n++;
          b.units.forEach((u) => {
            u.custom = false; u.id = u.id || uid('u');
            u.pages.forEach((p, i) => { p.id = p.id || 'p' + i; });
          });
        });
      });
    });
    lib.meta = { books: n, created: Date.now() };
    return lib;
  }

  async function loadAll() {
    const rec = await idbGet('meta', 'library');
    if (rec && rec.v) S.lib = rec.v;
    else { S.lib = seedLibrary(); await saveLib(); }
    const doneRec = await idbGet('meta', 'done');
    S.done = (doneRec && doneRec.v) || {};
    S.ready = true;
  }

  let libTimer = 0;
  function saveLib() {
    clearTimeout(libTimer);
    return new Promise((res) => {
      libTimer = setTimeout(async () => { await idbPut('meta', { k: 'library', v: S.lib }); res(); }, 120);
    });
  }
  function saveDone() { return idbPut('meta', { k: 'done', v: S.done }); }

  function findBook(bookId) {
    for (const s of S.lib.subjects) for (const c of s.categories) {
      const b = c.books.find((x) => x.id === bookId);
      if (b) return { subject: s, category: c, book: b };
    }
    return null;
  }
  function findUnit(book, unitId) { return book.units.find((u) => u.id === unitId) || null; }

  function bookProgress(book) {
    let total = 0, done = 0;
    book.units.forEach((u) => u.pages.forEach((p) => {
      total++;
      if (S.done[pageKey(book.id, u.id, p.id)]) done++;
    }));
    return { total, done };
  }
  function unitProgress(book, unit) {
    let done = 0;
    unit.pages.forEach((p) => { if (S.done[pageKey(book.id, unit.id, p.id)]) done++; });
    return { total: unit.pages.length, done };
  }

  /* ------------------------------------------------------------------ views */
  function show(view) {
    S.view = view;
    $$('.view').forEach((v) => v.classList.toggle('active', v.id === 'view-' + view));
    if (view === 'shelf') window.scrollTo(0, 0);
  }

  function hasDigital(bookId) {
    return !!(window.__DIGITAL__ && window.__DIGITAL__.books && window.__DIGITAL__.books[bookId]);
  }

  function coverHTML(book, catName) {
    const p = bookProgress(book);
    const badge = p.total
      ? (p.done >= p.total ? '<span class="badge done">완료 ✓</span>' : `<span class="badge">${p.done}/${p.total}</span>`)
      : '';
    const dg = hasDigital(book.id) ? '<span class="badge dg">✨ 디지털 문제</span>' : '';
    const cv = book.cover || {};
    if (cv.type === 'img') {
      const src = cv.blob ? blobUrlSync(cv.blob) : assetUrl(cv.src);
      return `<div class="cover"><img ${cv.blob ? `data-blob="${cv.blob}"` : ''} src="${esc(src)}" alt="" loading="lazy" decoding="async"><span class="spine"></span>${catName ? `<span class="ctag">${esc(catName)}</span>` : ''}${badge}${dg}</div>`;
    }
    const color = cv.color || book.color || '#e8613c';
    const txt = esc(book.title);
    return `<div class="cover plain" style="background:${color}">
      <div class="ct" style="color:${lcText(color)}">${txt}</div>
      <div class="ce">${book.emoji || '📘'}</div>
      <span class="spine"></span>${catName ? `<span class="ctag">${esc(catName)}</span>` : ''}${badge}${dg}</div>`;
  }

  const blobCache = {};
  function blobUrlSync(id) {
    if (blobCache[id]) return blobCache[id];
    idbGet('blobs', id).then((rec) => {
      if (!rec) return;
      blobCache[id] = rec.url || (rec.blob ? URL.createObjectURL(rec.blob) : '');
      if (!blobCache[id]) return;
      $$('img[data-blob="' + id + '"]').forEach((im) => { if (!im.src.startsWith('blob:')) im.src = blobCache[id]; });
    });
    return '';
  }
  async function blobUrl(id) {
    if (blobCache[id]) return blobCache[id];
    const rec = await idbGet('blobs', id);
    if (!rec) return '';
    blobCache[id] = rec.url || (rec.blob ? URL.createObjectURL(rec.blob) : '');
    return blobCache[id] || '';
  }
  function lcText(hex) {
    try {
      const c = hex.replace('#', '');
      const r = parseInt(c.slice(0, 2), 16), g = parseInt(c.slice(2, 4), 16), b = parseInt(c.slice(4, 6), 16);
      return (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? '#3a2f24' : '#fff';
    } catch (e) { return '#fff'; }
  }

  function renderShelf() {
    const wrap = $('#shelfBody');
    let books = 0, pages = 0;
    const parts = [];
    for (const sub of S.lib.subjects) {
      const subBooks = sub.categories.reduce((a, c) => a.concat(c.books), []);
      books += subBooks.length;
      subBooks.forEach((b) => b.units.forEach((u) => { pages += u.pages.length; }));
      parts.push(`<section class="subject">
        <div class="subject-head">
          <h2>${esc(sub.emoji || '📚')} ${esc(sub.name)}</h2>
          <span class="sub-count">${subBooks.length}권</span>
          ${sub.custom ? `<button class="del-subject" data-del-subject="${sub.id}">과목 삭제</button>` : ''}
        </div>`);
      if (!subBooks.length) {
        parts.push(`<div class="empty-note">아직 문제집이 없어요. <b>+ 문제집</b>으로 추가해 보세요.</div>`);
      }
      const cards = [];
      for (const cat of sub.categories) {
        for (const b of cat.books) {
          cards.push(`<div class="book ${b.custom ? 'custom' : ''}" data-book="${b.id}" role="button" tabindex="0">
            ${coverHTML(b, cat.name)}
            <div>
              <div class="book-title">${esc(b.title)}</div>
              <div class="book-sub">${esc(b.subtitle || (b.units.length ? b.units[0].title : '단원을 추가해 보세요'))}</div>
            </div>
            ${b.custom ? `<button class="mini-del" data-del-book="${b.id}">✕</button>` : ''}
          </div>`);
        }
      }
      if (cards.length) parts.push(`<div class="grid">${cards.join('')}</div>`);
      parts.push('</section>');
    }
    wrap.innerHTML = parts.join('');
    $('#shelfStat').textContent = `${books}권 · ${pages}쪽`;
  }

  async function openBook(bookId) {

    const p = bookProgress(b);
    $('#bookTitle').textContent = b.title;
    $('#bookSub').textContent = b.subtitle || found.category.name;
    const pct = p.total ? Math.round((p.done / p.total) * 100) : 0;
    const units = b.units.map((u) => {
      const up = unitProgress(b, u);

        <span class="uicon">${u.pages.length ? '📄' : '📁'}</span>
        <span>

          <span class="us">${up.total}쪽${up.done ? ` · ${up.done}쪽 완료` : ''}</span>

          <div class="progress-wrap"><span>${p.done}/${p.total}쪽</span><span class="bar"><i style="width:${pct}%"></i></span><span>${pct}%</span></div>
        </div>
      </div>
      ${hasDigital(b.id) ? `<button class="digital-cta" id="digitalBtn"><span>✨ 디지털 문제로 풀기</span><small>채점·해설·손글씨 연습장이 있는 문제집</small></button>` : ''}
      <ul class="unit-list">${units}</ul>

  /* -------------------------------------------------------------------- pad */
  const paper = () => $('#paper');
  const canvas = () => $('#padCanvas');
  const ctx2d = () => canvas().getContext('2d');

  async function openPad(bookId, unitId, idx) {
    const found = findBook(bookId);
    if (!found) return;
    const b = found.book, u = findUnit(b, unitId);
    if (!u || !u.pages.length) { toast('이 단원에는 아직 페이지가 없어요'); return; }
    S.bookId = bookId; S.unitId = unitId; S.pageIdx = clamp(idx, 0, u.pages.length - 1);
    S.zoom = localStorage.getItem('ysp-zoom') === '1';
    $('#padTitle').textContent = u.title;
    $('#padSub').textContent = b.title;
    show('pad');
    buildTools();
    updatePenModeUI();
    if (localStorage.getItem('ysp-tip') !== '1') {
      localStorage.setItem('ysp-tip', '1');
      setTimeout(() => toast('애플펜슬로 바로 써 보세요. 손바닥이 닿아도 괜찮아요 ✏️', 2600), 500);
    }
    await loadPage(true);
  }

  async function loadPage(first) {
    if (!first) await saveInkNow();
    const found = findBook(S.bookId);
    const b = found.book, u = findUnit(b, S.unitId);
    const p = u.pages[S.pageIdx];
    S.pageKey = pageKey(b.id, u.id, p.id);
    S.strokes = []; S.redo = [];
    const rec = await idbGet('ink', S.pageKey);
    if (rec) { S.strokes = rec.s || []; }
    updateDoneUI();
    const img = $('#padImg');
    const url = p.imgBlob ? (await blobUrl(p.imgBlob)) : assetUrl(p.img);
    $('#padLoading').style.display = url ? 'none' : 'grid';
    img.onload = () => {
      S.imgAR = img.naturalWidth / img.naturalHeight || 0.72;
      $('#padLoading').style.display = 'none';
      layoutPaper();
    };
    img.onerror = () => { $('#padLoading').textContent = '페이지 사진을 불러오지 못했어요'; };
    img.src = url;
    if (img.complete && img.naturalWidth) { S.imgAR = img.naturalWidth / img.naturalHeight; img.onload(); }
    // neighbour preload
    [S.pageIdx + 1, S.pageIdx - 1].forEach((i) => {
      const q = u.pages[i];
      if (q && !q.imgBlob) { const pre = new Image(); pre.src = assetUrl(q.img); }
    });
    $('#pageno').textContent = `${S.pageIdx + 1} / ${u.pages.length}`;
    $('#prevBtn').disabled = S.pageIdx === 0;
    $('#nextBtn').disabled = S.pageIdx >= u.pages.length - 1;
    $('#pageLabel').textContent = p.label || '';
    layoutPaper();
    const st = $('#stage'); st.scrollTop = 0; st.scrollLeft = 0;
  }

  function layoutPaper() {
    const st = $('#stage');
    const availW = Math.max(120, st.clientWidth - 24);
    const availH = Math.max(120, st.clientHeight - 24);
    const ar = S.imgAR || 0.72;
    let w, h;
    if (S.zoom) {
      h = availH * 1.7; w = h * ar;
      if (w < availW * 0.96) { w = availW * 0.96; h = w / ar; }
    } else {
      h = availH; w = h * ar;
      if (w > availW) { w = availW; h = w / ar; }
    }
    const P = paper();
    P.style.width = Math.round(w) + 'px';
    P.style.height = Math.round(h) + 'px';
    sizeCanvas();
  }

  function sizeCanvas() {
    const P = paper(); const cv = canvas();
    const w = P.clientWidth, h = P.clientHeight;
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    const ctx = ctx2d();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    redraw();
  }

  function tracePath(ctx, d, W, H) {
    const n = d.length / 2;
    ctx.beginPath();
    if (n === 0) return;
    ctx.moveTo(d[0] * W, d[1] * H);
    if (n === 1) return;
    if (n === 2) { ctx.lineTo(d[2] * W, d[3] * H); return; }
    for (let i = 1; i < n - 1; i++) {
      const xc = (d[2 * i] * W + d[2 * i + 2] * W) / 2;
      const yc = (d[2 * i + 1] * H + d[2 * i + 3] * H) / 2;
      ctx.quadraticCurveTo(d[2 * i] * W, d[2 * i + 1] * H, xc, yc);
    }
    ctx.lineTo(d[2 * (n - 1)] * W, d[2 * (n - 1) + 1] * H);
  }

  function paintStroke(ctx, st, W, H) {
    const d = st.d;
    if (!d || d.length < 2) return;
    ctx.save();
    if (st.t === 'h') { ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 0.42; }
    else if (st.t === 'e') { ctx.globalCompositeOperation = 'destination-out'; ctx.globalAlpha = 1; }
    else { ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1; }
    const lw = Math.max(0.7, (st.w || 0.005) * W);
    ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.strokeStyle = st.c || '#22201d'; ctx.fillStyle = st.c || '#22201d';
    if (d.length === 2) {
      ctx.beginPath(); ctx.arc(d[0] * W, d[1] * H, lw / 2, 0, Math.PI * 2); ctx.fill();
    } else {
      tracePath(ctx, d, W, H);
      ctx.stroke();
    }
    ctx.restore();
  }

  function redraw() {
    const cv = canvas();
    const ctx = ctx2d();
    const W = cv.clientWidth, H = cv.clientHeight;
    ctx.clearRect(0, 0, W, H);
    for (const st of S.strokes) paintStroke(ctx, st, W, H);
  }

  /* ------------------------------------------------------------ drawing I/O */
  function pos(e) {
    const r = canvas().getBoundingClientRect();
    return [clamp((e.clientX - r.left) / r.width, 0, 1), clamp((e.clientY - r.top) / r.height, 0, 1)];
  }

  function onDown(e) {
    if (!S.ready) return;
    const type = e.pointerType || 'mouse';
    if (type === 'pen') {
      S.active.add(e.pointerId);
      if (S.cur) return;
      startStroke(e);
      return;
    }
    if (S.penOnly) return;                       // 손가락·마우스는 화면 이동만
    S.active.add(e.pointerId);
    if (S.active.size > 1) { abortStroke(); startPan(e); return; }
    startStroke(e);
  }

  function startStroke(e) {
    e.preventDefault();
    const cv = canvas();
    if (cv.setPointerCapture) { try { cv.setPointerCapture(e.pointerId); } catch (err) {} }
    const [x, y] = pos(e);
    S.cur = { t: S.tool === 'hl' ? 'h' : S.tool === 'eraser' ? 'e' : 'p', c: curColor(), w: curWidth(), d: [x, y] };
    S.redo = [];
    S.strokes.push(S.cur);
    redraw();
    const ctx = ctx2d();
    ctx.save();
    ctx.fillStyle = S.cur.c; ctx.globalAlpha = S.cur.t === "h" ? 0.42 : 1;
    ctx.beginPath(); ctx.arc(x * cv.clientWidth, y * cv.clientHeight, Math.max(0.7, S.cur.w * cv.clientWidth) / 2, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function onMove(e) {
    if (S.pan && S.active.size > 1) { doPan(e); return; }
    if (!S.cur) return;
    e.preventDefault();
    const [x, y] = pos(e);
    const d = S.cur.d;
    const lx = d[d.length - 2], ly = d[d.length - 1];
    if (Math.hypot(x - lx, y - ly) < 0.0012) return;
    d.push(x, y);
    // incremental paint of the new segment
    const ctx = ctx2d(); const cv = canvas();
    const W = cv.clientWidth, H = cv.clientHeight;
    ctx.save();
    if (S.cur.t === 'h') { ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 0.42; }
    else if (S.cur.t === 'e') { ctx.globalCompositeOperation = 'destination-out'; ctx.globalAlpha = 1; }
    ctx.lineWidth = Math.max(0.7, S.cur.w * W);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.strokeStyle = S.cur.c;
    ctx.beginPath(); ctx.moveTo(lx * W, ly * H); ctx.lineTo(x * W, y * H); ctx.stroke();
    ctx.restore();
  }

  function onUp(e) {
    S.active.delete(e.pointerId);
    if (S.pan) { if (S.active.size < 2) { S.pan = null; } return; }
    if (!S.cur) return;
    S.cur = null;
    redraw();               // smooth redraw of the finished stroke
    buildTools();
    scheduleSave();
  }

  function abortStroke() {
    if (S.cur) { S.strokes.pop(); S.cur = null; redraw(); }
  }

  function startPan(e) {
    const st = $('#stage');
    S.pan = { x: e.clientX, y: e.clientY, sl: st.scrollLeft, st: st.scrollTop, pts: {} };
    S.pan.pts[e.pointerId] = [e.clientX, e.clientY];
  }
  function doPan(e) {
    const st = $('#stage');
    if (!S.pan.pts[e.pointerId]) S.pan.pts[e.pointerId] = [e.clientX, e.clientY];
    const before = S.pan.pts[e.pointerId];
    const dx = e.clientX - before[0], dy = e.clientY - before[1];
    S.pan.pts[e.pointerId] = [e.clientX, e.clientY];
    st.scrollLeft -= dx; st.scrollTop -= dy;
  }

  /* --------------------------------------------------------------- ink saves */
  function scheduleSave() {
    clearTimeout(S.saveTimer);
    S.saveTimer = setTimeout(saveInkNow, 320);
  }
  async function saveInkNow() {
    clearTimeout(S.saveTimer);
    if (!S.pageKey) return;
    try { await idbPut('ink', { k: S.pageKey, s: S.strokes, u: Date.now() }); } catch (err) { console.warn(err); }
  }

  /* ------------------------------------------------------------------ tools */
  function buildTools() {
    const sw = $('#swatches');
    const cols = S.tool === 'hl' ? HL_COLORS : PEN_COLORS;
    const active = S.tool === 'hl' ? S.hlColor : S.penColor;
    sw.innerHTML = S.tool === 'eraser' ? '' : cols.map((c) => `<button class="sw ${c === active ? 'on' : ''}" data-color="${c}" style="background:${c}"></button>`).join('');
    const dots = $('#dots');
    const arr = widthArr(S.tool), idx = widthIdx();
    dots.innerHTML = arr.map((v, i) => `<button class="dot-btn ${i === idx ? 'on' : ''}" data-w="${i}">
      <span class="dot" style="width:${6 + i * 6}px;height:${6 + i * 6}px"></span></button>`).join('');
    $$('.tool[data-tool]').forEach((t) => t.classList.toggle('on', t.dataset.tool === S.tool));
    $('#undoBtn').style.opacity = S.strokes.length ? 1 : 0.35;
    $('#redoBtn').style.opacity = S.redo.length ? 1 : 0.35;
  }

  function setTool(t) { S.tool = t; buildTools(); }

  function updatePenModeUI() {
    const on = S.penOnly;
    const btn = $('#penBtn');
    btn.classList.toggle('on', on);
    btn.querySelector('.wide').textContent = on ? '✏️ 펜슬만 쓰기' : '👆 손가락도 쓰기';
    btn.querySelector('.narrow').textContent = on ? '✏️ 펜슬만' : '👆 손가락';
    paper().classList.toggle('pen-only', on);
  }

  function updateDoneUI() {
    const u = findUnit(findBook(S.bookId).book, S.unitId);
    const p = u.pages[S.pageIdx];
    const done = !!S.done[pageKey(S.bookId, S.unitId, p.id)];
    $('#padDone').classList.toggle('on', done);
    $('#padDone').textContent = done ? '✅ 다 풀었어요' : '⬜ 다 풀었어요';
    $('#zoomBtn').classList.toggle('on', S.zoom);
    $('#zoomBtn .wide').textContent = S.zoom ? '🔎 확대 보기' : '🔍 맞춤 보기';
    $('#zoomBtn .narrow').textContent = S.zoom ? '🔎 확대' : '🔍 맞춤';
  }

  async function toggleDone() {
    const u = findUnit(findBook(S.bookId).book, S.unitId);
    const p = u.pages[S.pageIdx];
    const k = pageKey(S.bookId, S.unitId, p.id);
    if (S.done[k]) { delete S.done[k]; toast('완료 표시를 지웠어요'); }
    else { S.done[k] = true; toast('이 쪽 완료! 참 잘했어요 🎉'); }
    updateDoneUI();
    await saveDone();
  }


  /* ----------------------------------------------------------------- modals */
  function modal(html, cls) {
    const back = $('#modalBack');
    back.innerHTML = `<div class="modal ${cls || ''}">${html}</div>`;
    back.classList.add('show');
    return back.firstElementChild;
  }
  function closeModal() { $('#modalBack').classList.remove('show'); $('#modalBack').innerHTML = ''; }

  function confirmBox(title, text, okText, danger) {
    return new Promise((res) => {
      const m = modal(`
        <h3>${esc(title)}</h3>
        <div style="font-size:13.5px;line-height:1.6;color:#6f6357;font-weight:600">${text}</div>
        <div class="modal-actions">
          <button class="cancel" id="mNo">취소</button>
          <button class="ok ${danger ? 'danger' : ''}" id="mYes">${esc(okText || '확인')}</button>
        </div>`);
      m.querySelector('#mNo').onclick = () => { closeModal(); res(false); };
      m.querySelector('#mYes').onclick = () => { closeModal(); res(true); };
    });
  }

  function subjectOptions(sel) {
    return S.lib.subjects.map((s) => `<option value="${s.id}" ${s.id === sel ? 'selected' : ''}>${esc(s.name)}</option>`).join('');
  }

    m.querySelector('#mNo').onclick = closeModal;
    m.querySelector('#mYes').onclick = async () => {

/* ------------------------------------------------------------------- 잉크 엔진 */
function mkInk(cv, key, opt) {
  const o = opt || {};
  const st = {
    strokes: [], redo: [],
    tool: o.tool || 'pen',
    color: o.color || '#2a231c',
    w: o.w || 0.0042
  };
  let cur = null, down = false;
  const ctx = () => cv.getContext('2d');

  function paint() {
    const W = cv.clientWidth, H = cv.clientHeight;
    if (!W || !H) return;
    ctx().clearRect(0, 0, W, H);
    for (const s of st.strokes) paintStroke(ctx(), s, W, H);
  }
  function resize() {
    const W = cv.clientWidth, H = cv.clientHeight;
    if (!W || !H) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    if (cv.width === Math.round(W * dpr) && cv.height === Math.round(H * dpr)) { paint(); return; }
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx().setTransform(dpr, 0, 0, dpr, 0, 0);
    paint();
  }
  function rel(e) {
    const r = cv.getBoundingClientRect();
    return [clamp((e.clientX - r.left) / r.width, 0, 1), clamp((e.clientY - r.top) / r.height, 0, 1)];
  }
  let t0 = 0;
  function save() {
    clearTimeout(t0);
    t0 = setTimeout(() => { idbPut('ink', { k: key, s: st.strokes, u: Date.now() }).catch(() => {}); }, 320);
  }
  cv.addEventListener('pointerdown', (e) => {
    if (e.button !== undefined && e.button > 0) return;
    e.preventDefault();
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    const [x, y] = rel(e);
    down = true;
    cur = {
      t: st.tool === 'eraser' ? 'e' : st.tool === 'hl' ? 'h' : 'p',
      c: st.tool === 'eraser' ? '#000' : st.color,
      w: st.tool === 'eraser' ? 0.03 : st.w,
      d: [x, y]
    };
    st.strokes.push(cur); st.redo = [];
    paint();
  });
  cv.addEventListener('pointermove', (e) => {
    if (!down || !cur) return;
    e.preventDefault();
    const [x, y] = rel(e);
    const d = cur.d, lx = d[d.length - 2], ly = d[d.length - 1];
    if (Math.hypot(x - lx, y - ly) < 0.0012) return;
    d.push(x, y);
    const W = cv.clientWidth, H = cv.clientHeight, c = ctx();
    c.save();
    if (cur.t === 'h') { const a = c.globalAlpha; c.globalAlpha = 0.32; }
    if (cur.t === 'e') c.globalCompositeOperation = 'destination-out';
    c.lineWidth = Math.max(0.8, cur.w * W); c.lineCap = 'round'; c.lineJoin = 'round';
    c.strokeStyle = cur.c;
    c.beginPath(); c.moveTo(lx * W, ly * H); c.lineTo(x * W, y * H); c.stroke();
    c.restore();
  });
  const up = () => { if (!down) return; down = false; cur = null; paint(); save(); };
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', up);
  cv.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse') up(); });
  cv.addEventListener('contextmenu', (e) => e.preventDefault());

  if (key) idbGet('ink', key).then((rec) => { if (rec && rec.s && rec.s.length) { st.strokes = rec.s; paint(); } }).catch(() => {});
  return { st, resize, paint, save };
}

function mountInk(el, key, opt) {
  const cv = el.querySelector('canvas');
  if (!cv) return null;
  const ink = mkInk(cv, key, opt);
  if (!DG.ink[key]) DG.ink[key] = ink;
  const ro = new ResizeObserver(() => ink.resize());
  ro.observe(cv);
  setTimeout(() => ink.resize(), 30);
  return ink;
}

/* 지문 안에서 형광펜·낱말 표시를 문자열 조각으로 만들기 */
function richHTML(text, ranges, words) {
  const n = text.length;
  const hl = new Array(n).fill(false);
  (ranges || []).forEach((r) => {
    for (let i = Math.max(0, r.s); i < Math.min(n, r.e); i++) hl[i] = true;
  });
  const vw = new Array(n).fill(false);
  (words || []).forEach((w) => {
    if (!w) return;
    let from = 0, idx;
    while ((idx = text.indexOf(w, from)) >= 0) {
      for (let i = idx; i < idx + w.length; i++) vw[i] = true;
      from = idx + w.length;
    }
  });
  let out = '', i = 0;
  while (i < n) {
    const key = (hl[i] ? 1 : 0) + (vw[i] ? 2 : 0);
    let j = i;
    while (j < n && ((hl[j] ? 1 : 0) + (vw[j] ? 2 : 0)) === key) j++;
    const piece = esc(text.slice(i, j));
    if (key === 0) out += piece;
    else if (key === 1) out += `<mark class="dghl">${piece}</mark>`;
    else if (key === 2) out += `<span class="dgw">${piece}</span>`;
    else out += `<mark class="dghl"><span class="dgw">${piece}</span></mark>`;
    i = j;
  }
  return out;
}

  ];

    const ranges = DG.hl.filter((r) => r.p === i);

    const num = para.t && para.t.length > 24 ? `<span class="pnum">${n++}</span>` : '';
    parts.push(`<p class="dgpar" data-p="${i}">${num}${mk}<span class="ptext">${richHTML(para.t, ranges, wordList())}</span></p>`);

  parts.push('<canvas id="dgPen" class="dg-pen"></canvas>');
  paper.innerHTML = parts.join('');
  const cv = $('#dgPen');
  DG.passageInk = mkInk(cv, 'dgink:' + DG.bookId + ':passage', { color: '#c8452c', w: 0.0038 });
  if (prevStrokes) { DG.passageInk.st.strokes = prevStrokes; DG.passageInk.paint(); }
  const ro = new ResizeObserver(() => DG.passageInk && DG.passageInk.resize());
  ro.observe(paper);
  setTimeout(() => { DG.passageInk.resize(); $('#dgLScroll').scrollTop = sc; }, 20);
  applyPassageMode();
}

function applyPassageMode() {
  const paper = $('#dgPaper');
  if (!paper) return;
  const pen = DG.ptool === 'pen' || DG.ptool === 'eraser';
  paper.classList.toggle('penmode', pen);
  const cv = $('#dgPen');
  if (cv) cv.style.pointerEvents = pen ? 'auto' : 'none';
  if (DG.passageInk) DG.passageInk.st.tool = DG.ptool === 'eraser' ? 'eraser' : 'pen';
  $$('.ptool').forEach((b) => b.classList.toggle('on', b.dataset.ptool === DG.ptool));
}

const paraEl = (node) => {
  let n = node && node.nodeType === 1 ? node : (node ? node.parentElement : null);
  while (n && !(n.classList && n.classList.contains('dgpar'))) n = n.parentElement;
  return n;
};
function offIn(el, node, off) {
  const tEl = el.querySelector('.ptext') || el;
  try {
    const r = document.createRange();
    r.selectNodeContents(tEl);
    r.setEnd(node, off);
    return Math.min(tEl.textContent.length, r.toString().length);
  } catch (e) { return 0; }
}
function mergeHL(list) {
  const out = [];
  list.slice().sort((a, b) => (a.p - b.p) || (a.s - b.s)).forEach((r) => {
    const last = out[out.length - 1];
    if (last && last.p === r.p && r.s <= last.e) last.e = Math.max(last.e, r.e);
    else out.push({ p: r.p, s: r.s, e: r.e });
  });
  return out;
}
function onPassageUp() {
  if (DG.ptool !== 'hl') return;
  const sel = window.getSelection();
  if (!sel || !sel.rangeCount || sel.isCollapsed) return;
  const r = sel.getRangeAt(0);
  const paper = $('#dgPaper');
  if (!paper || !paper.contains(r.commonAncestorContainer)) return;
  const a = paraEl(r.startContainer), b = paraEl(r.endContainer);
  if (!a || !b) return;
  const i0 = +a.dataset.p, i1 = +b.dataset.p;
  const paras = DG.book.passage.paras;
  for (let p = i0; p <= i1; p++) {
    const el = paper.querySelector('.dgpar[data-p="' + p + '"]');
    if (!el) continue;
    const t = (paras[p] && paras[p].t) || '';
    let s = 0, e = t.length;
    if (p === i0) s = offIn(el, r.startContainer, r.startOffset);
    if (p === i1) e = offIn(el, r.endContainer, r.endOffset);
    if (e - s >= 1) DG.hl.push({ p, s, e });
  }
  sel.removeAllRanges();
  DG.hl = mergeHL(DG.hl);
  dgSaveHL();
  renderPassage(true);
  toast('형광펜으로 표시했어요 🖍️', 1200);
}

    ${hint}${quote}${aside}

function findQ(id) {

}

function paintResult(card, ok) {

/* ------------------------------------------------------------------- 채점 (국어) */
function gradeOne(id) {
  const f = findQ(id);
  if (!f) return;
  const { sec, q } = f;
  const card = document.querySelector('.qcard[data-qid="' + id + '"]');
  if (!card) return;
  let ok = true;
  if (q.type === 'choice') {
    const sel = (DG.ans[id + '#sel'] || '').split(',').filter((x) => x !== '').map(Number).sort((a, b) => a - b);
    const ans = q.a.slice().sort((a, b) => a - b);
    ok = ans.length === sel.length && ans.every((v, i) => v === sel[i]);
    card.querySelectorAll('.opt').forEach((o) => {
      const oi = +o.dataset.oi;
      o.classList.remove('sel', 'right', 'wrong');
      if (ans.includes(oi)) o.classList.add('right');
      else if (sel.includes(oi)) o.classList.add('wrong');
    });
  } else if (q.type === 'match') {
    q.left.forEach((w, li) => {
      const el = card.querySelector('.msel[data-mi="' + li + '"]');
      const val = el ? el.value : '';
      const good = val !== '' && String(q.a[li]) === val;
      if (el) { el.classList.toggle('ok', good); el.classList.toggle('bad', !good); }
      if (!good) ok = false;
    });
  } else {
    (q.blocks || []).forEach((bk, bi) => {
      bk.parts.forEach((pt, pi) => {
        if (pt.k !== 'b') return;
        const bidx = bi + '_' + pi;
        const wants = pt.a.map(normAns);
        if (pt.opts) {
          const cur = DG.ans[id + '#' + bidx] || '';
          const good = wants.includes(normAns(cur));
          const wrap = card.querySelector('.picks[data-b="' + bidx + '"]');
          if (wrap) wrap.querySelectorAll('.pk').forEach((b) => {
            b.classList.remove('on', 'right', 'wrong');
            if (wants.includes(normAns(b.dataset.val))) b.classList.add('right');
            else if (b.dataset.val === cur) b.classList.add('wrong');
          });
          if (!good) ok = false;
        } else {
          const el = card.querySelector('.qin[data-b="' + bidx + '"]');
          const v = el ? el.value : '';
          const good = wants.includes(normAns(v));
          if (el) { el.classList.toggle('ok', good); el.classList.toggle('bad', !good); }
          if (!good) ok = false;
        }
      });
    });
  }
  DG.graded[id] = { ok, t: Date.now() };
  dgSave();
  paintResult(card, ok);
  showExplain(card, q);
  afterGrade(sec, ok);
}

function showExplain(card, q, force) {
  const id = card.dataset.qid;
  const exp = card.querySelector('.qexp');
  if (!exp) return;
  const txt = q.explain || '';
  if (exp.classList.contains('show') && !force) { exp.classList.remove('show'); return; }
  exp.innerHTML = txt ? `<b>해설</b> ${esc(txt)}` : '<b>해설</b> 없음';
  exp.classList.add('show');
}

function afterGrade(sec, ok) {
  updateDgProgress();
  const all = DG.book.sections.reduce((a, s) => a + s.qs.length, 0);
  const good = DG.book.sections.reduce((a, s) => a + s.qs.filter((q) => DG.graded[dgQid(s, q)] && DG.graded[dgQid(s, q)].ok).length, 0);
  if (good === all && all > 0) {
    confetti(30, true);
    toast('전부 맞혔어요! 별표를 받았어요 ⭐🎉', 2600);
  } else if (ok && sec && sec.qs.every((q) => DG.graded[dgQid(sec, q)] && DG.graded[dgQid(sec, q)].ok)) {
    confetti(16, false);
    toast('이 부분 다 맞혔어요! 🎉', 2200);
  }
}

/* ------------------------------------------------------------------- 채점 (수학) */
function mathExplain(q) {
  const fa = q.fa.join(' × '), fb = q.fb.join(' × ');
  const pool = q.fb.slice(), common = [];
  q.fa.forEach((f) => { const i = pool.indexOf(f); if (i >= 0) { common.push(f); pool.splice(i, 1); } });
  let gcdLine;
  if (common.length > 1) {
    const prod = common.reduce((a, b) => a * +b, 1);
    gcdLine = `공통인 수 ${common.join(' × ')} = ${prod}`;
  } else gcdLine = `공통인 수 ${common[0] || '없음'}`;
  return `${q.pair[0]} = ${fa}, ${q.pair[1]} = ${fb} → ${gcdLine} → 최대공약수 ${q.gcd}`;
}

function gradeMathCard(id) {
  const card = document.querySelector('.mcard[data-qid="' + id + '"]');
  if (!card) return;
  const f = findQ(id);
  if (!f) return;
  const q = f.q;
  let ok = true;
  const group = (sel, want) => {
    const els = Array.from(card.querySelectorAll(sel));
    if (!els.length) return true;
    const vals = els.map((e) => normNum(e.value));
    const w = want.map(normNum).slice().sort();
    const g = vals.slice().sort();
    const good = vals.every((v) => v !== '') && w.length === g.length && w.every((v, i) => v === g[i]);
    els.forEach((e) => { e.classList.toggle('ok', good); e.classList.toggle('bad', !good); });
    return good;
  };
  if (f.sec.mode === 'factors') {
    if (!group('[data-f="a"]', q.fa)) ok = false;
    if (!group('[data-f="b"]', q.fb)) ok = false;
  }
  const gEl = card.querySelector('[data-g]');
  const good = gEl && normNum(gEl.value) === normNum(q.gcd);
  if (gEl) { gEl.classList.toggle('ok', !!good); gEl.classList.toggle('bad', !good); }
  if (!good) ok = false;
  DG.graded[id] = { ok: !!ok, t: Date.now() };
  dgSave();
  paintResult(card, ok);
  const exp = card.querySelector('.mexp');
  if (exp) { exp.innerHTML = `<b>풀이</b> ${esc(mathExplain(q))}`; exp.classList.add('show'); }
  afterGrade(f.sec, !!ok);
}

/* -------------------------------------------------------------------- TTS */
function stopTTS() {
  DG.ttsOn = false;
  DG.ttsIdx = -1;
  try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) {}
  $$('.dgpar.reading').forEach((p) => p.classList.remove('reading'));
  const b = $('#dgTts');
  if (b) { b.classList.remove('on'); b.textContent = '🔊 읽어주기'; }
}
function speakPassage() {
  if (!('speechSynthesis' in window)) { toast('이 브라우저에서는 읽어주기를 쓸 수 없어요'); return; }
  if (DG.ttsOn) { stopTTS(); return; }
  const paras = $$('#dgPaper .dgpar');
  if (!paras.length) return;
  DG.ttsOn = true;
  DG.ttsIdx = 0;
  const btn = $('#dgTts');
  if (btn) { btn.classList.add('on'); btn.textContent = '⏹ 멈추기'; }
  const speakAt = (i) => {
    if (!DG.ttsOn) return;
    if (i >= paras.length) { stopTTS(); toast('끝까지 읽었어요 👏', 1600); return; }
    paras.forEach((p) => p.classList.remove('reading'));
    const el = paras[i];
    el.classList.add('reading');
    if (el.scrollIntoView) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
    const u = new SpeechSynthesisUtterance(el.textContent.trim());
    u.lang = 'ko-KR';
    u.rate = 0.92;
    u.pitch = 1.02;
    const vs = window.speechSynthesis.getVoices() || [];
    const ko = vs.find((v) => /ko(-|_)KR/i.test(v.lang)) || vs.find((v) => /^ko/i.test(v.lang));
    if (ko) u.voice = ko;
    u.onend = () => { if (DG.ttsOn) speakAt(i + 1); };
    u.onerror = () => { if (DG.ttsOn) speakAt(i + 1); };
    DG.ttsIdx = i;
    try { window.speechSynthesis.speak(u); } catch (e) { stopTTS(); }
  };
  speakAt(0);
}

/* -------------------------------------------------------------------- 축하 효과 */
function confetti(n, big) {
  const box = document.createElement('div');
  box.className = 'dg-confetti' + (big ? ' big' : '');
  const emo = ['⭐', '🎉', '✨', '🌟', '💛', '🎈', '🥳'];
  const count = n || 18;
  for (let i = 0; i < count; i++) {
    const s = document.createElement('span');
    s.textContent = emo[i % emo.length];
    s.style.left = (Math.random() * 96 + 2) + '%';
    s.style.animationDelay = (Math.random() * 0.5).toFixed(2) + 's';
    s.style.fontSize = (16 + Math.random() * 22).toFixed(0) + 'px';
    s.style.setProperty('--drift', (Math.random() * 160 - 80).toFixed(0) + 'px');
    box.appendChild(s);
  }
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 2700);
}

/* -------------------------------------------------------------------- 이벤트 연결 */
function bindDigital() {
  $('#dgBack').onclick = () => { stopTTS(); renderShelf(); show('shelf'); };

  $('#dgPhotoBtn').onclick = () => {
    DG.photoOpen = !DG.photoOpen;
    buildPhotoOverlay();
    applyHeaderChips();
  };

  const bookBtn = $('#dgBookBtn');
  if (bookBtn) bookBtn.onclick = () => { stopTTS(); openBook(DG.bookId); };

  const body = $('#dgBody');

  const pvBox = $('#dgPhoto');
  if (pvBox) {
    pvBox.addEventListener('click', (e) => {
      const pv = e.target.closest('[data-pv]');
      if (pv) { DG.photoIdx = +pv.dataset.pv; buildPhotoOverlay(); return; }
      if (e.target.closest('#pvClose')) { DG.photoOpen = false; buildPhotoOverlay(); applyHeaderChips(); }
    });
  }

  body.addEventListener('click', (e) => {
    const t = e.target;

    // 원본 사진 탭/닫기
    const pv = t.closest('[data-pv]');
    if (pv) { DG.photoIdx = +pv.dataset.pv; buildPhotoOverlay(); return; }
    if (t.closest('#pvClose')) { DG.photoOpen = false; buildPhotoOverlay(); applyHeaderChips(); return; }

    // 지문 도구
    const tool = t.closest('[data-ptool]');
    if (tool) {
      const k = tool.dataset.ptool;
      if (k === 'clear') {
        confirmBox('지문 표시 지우기', '지문에 한 <b>형광펜</b>과 <b>펜 필기</b>를 모두 지울까요?', '모두 지우기', true).then((ok) => {
          if (!ok) return;
          DG.hl = []; dgSaveHL();
          if (DG.passageInk) { DG.passageInk.st.strokes = []; DG.passageInk.paint(); DG.passageInk.save(); }
          renderPassage(true);
          toast('지문 표시를 지웠어요');
        });
        return;
      }
      DG.ptool = k;
      applyPassageMode();
      if (k === 'hl') toast('글자를 쓸-듯 밀어서 형광펜을 칠해 보세요 🖍️', 2200);
      else if (k === 'pen') toast('펜으로 밑줄을 그어 보세요 ✏️', 1800);
      return;
    }
    if (t.closest('#dgTts')) { speakPassage(); return; }

    // 섹션 탭
    const tab = t.closest('.dg-tab[data-sec]');
    if (tab) { DG.secIdx = DG.book.sections.findIndex((s) => s.id === tab.dataset.sec); renderDigital(); return; }
    const mtab = t.closest('.dg-tab[data-msec]');
    if (mtab) {
      const el = $('[data-msecblock="' + mtab.dataset.msec + '"]');
      if (el) el.scrollIntoView({ block: 'start', behavior: 'smooth' });
      $$('.dg-tab[data-msec]').forEach((b) => b.classList.toggle('on', b === mtab));
      return;
    }

    // 보기 버튼 (객관식)
    const opt = t.closest('.opt');
    if (opt) {
      const id = opt.dataset.qid, oi = opt.dataset.oi;
      const f = findQ(id); if (!f) return;
      let sel = (DG.ans[id + '#sel'] || '').split(',').filter((x) => x !== '');
      if (f.q.multi) {
        sel = sel.includes(oi) ? sel.filter((x) => x !== oi) : sel.concat(oi);
      } else {
        sel = sel.includes(oi) ? [] : [oi];
      }
      DG.ans[id + '#sel'] = sel.join(',');
      dgSave();
      opt.closest('.opts').querySelectorAll('.opt').forEach((o) => {
        o.classList.toggle('sel', sel.includes(o.dataset.oi));
        o.classList.remove('right', 'wrong');
      });
      const card = opt.closest('.qcard');
      if (card) { card.classList.remove('ok', 'bad'); const r = card.querySelector('.qres'); if (r) r.textContent = ''; }
      return;
    }

    // 고르기 칩
    const pk = t.closest('.pk');
    if (pk) {
      const id = pk.dataset.qid, bidx = pk.dataset.b, val = pk.dataset.val;
      DG.ans[id + '#' + bidx] = val;
      dgSave();
      pk.closest('.picks').querySelectorAll('.pk').forEach((b) => {
        b.classList.toggle('on', b.dataset.val === val);
        b.classList.remove('right', 'wrong');
      });
      const card = pk.closest('.qcard');
      if (card) { card.classList.remove('ok', 'bad'); const r = card.querySelector('.qres'); if (r) r.textContent = ''; }
      return;
    }

    // 채점 / 해설 / 손글씨
    const g = t.closest('[data-grade]');
    if (g) { gradeOne(g.dataset.grade); return; }
    const mg = t.closest('[data-mgrade]');
    if (mg) { gradeMathCard(mg.dataset.mgrade); return; }
    const sol = t.closest('[data-sol]');
    if (sol) {
      const card = sol.closest('.qcard');
      const f = findQ(sol.dataset.sol);
      if (card && f) showExplain(card, f.q, true);
      return;
    }
    const msol = t.closest('[data-msol]');
    if (msol) {
      const card = msol.closest('.mcard');
      const f = findQ(msol.dataset.msol);
      if (card && f) {
        const exp = card.querySelector('.mexp');
        exp.innerHTML = `<b>풀이</b> ${esc(mathExplain(f.q))}`;
        exp.classList.add('show');
      }
      return;
    }
    const hand = t.closest('[data-hand]');
    if (hand) {
      const id = hand.dataset.hand;
      const hw = document.querySelector('.handwrap[data-handwrap="' + id + '"]');
      if (!hw) return;
      hw.classList.toggle('open');
      if (hw.classList.contains('open')) {
        hand.classList.add('on');
        mountInk(hw, 'dgink:' + DG.bookId + ':hand:' + id);
      } else hand.classList.remove('on');
      return;
    }
    const scr = t.closest('[data-scratch]');
    if (scr) {
      const id = scr.dataset.scratch;
      const sc = document.querySelector('.scratch[data-scr="' + id + '"]');
      if (!sc) return;
      sc.classList.toggle('open');
      const open = sc.classList.contains('open');
      scr.textContent = open ? '✏️ 연습장 접기' : '✏️ 연습장 펴기';
      if (open) mountInk(sc, 'dgink:' + DG.bookId + ':scr:' + id, { color: '#1f4fa8', w: 0.0045 });
      return;
    }

    // 필기 도구 (연습장 · 손글씨)
    const st = t.closest('[data-st]');
    if (st) {
      const wrap = st.closest('.scratch, .handwrap');
      const cv = wrap && wrap.querySelector('canvas');
      const key = wrap && (wrap.dataset.scr ? 'dgink:' + DG.bookId + ':scr:' + wrap.dataset.scr : 'dgink:' + DG.bookId + ':hand:' + wrap.dataset.handwrap);
      const ink = key ? DG.ink[key] : null;
      if (!ink) return;
      if (st.dataset.st === 'clear') {
        ink.st.strokes = []; ink.st.redo = []; ink.paint(); ink.save();
        return;
      }
      ink.st.tool = st.dataset.st;
      wrap.querySelectorAll('[data-st]').forEach((b) => b.classList.toggle('on', b === st && st.dataset.st !== 'clear'));
      return;
    }

    // 낱말 뜻
    const w = t.closest('.dgw');
    if (w) { const d = wordDef(w.textContent.trim()); if (d) toast(w.textContent.trim() + ' — ' + d, 2600); return; }

    // 전체 채점 / 다시 풀기
    if (t.closest('#dgGradeAll')) {
      if (DG.book.kind === 'kor') {
        const sec = DG.book.sections[DG.secIdx];
        sec.qs.forEach((q) => gradeOne(dgQid(sec, q)));
      } else {
        allQ().forEach((x) => gradeMathCard(x.id));
      }
      return;
    }
    if (t.closest('#dgReset')) {
      const ids = DG.book.kind === 'kor'
        ? DG.book.sections[DG.secIdx].qs.map((q) => dgQid(DG.book.sections[DG.secIdx], q))
        : allQ().map((x) => x.id);
      confirmBox('다시 풀기', '이 부분에 쓴 <b>답과 채점</b>을 지울까요? (필기는 그대로 남아요)', '답 지우기', true).then((ok) => {
        if (!ok) return;
        Object.keys(DG.ans).forEach((k) => { if (ids.some((id) => k.startsWith(id + '#'))) delete DG.ans[k]; });
        ids.forEach((id) => delete DG.graded[id]);
        dgSave();
        if (DG.book.kind === 'kor') renderQuestions(); else renderDigital();
        updateDgProgress();
        toast('답을 지웠어요. 다시 풀어 보세요!');
      });
      return;
    }
  });

  body.addEventListener('input', (e) => {
    const el = e.target;
    if (el.classList && el.classList.contains('qin')) {
      DG.ans[el.dataset.qid + '#' + el.dataset.b] = el.value;
      dgSave();
      const card = el.closest('.qcard');
      if (card) { card.classList.remove('ok', 'bad'); const r = card.querySelector('.qres'); if (r) r.textContent = ''; }
    } else if (el.classList && el.classList.contains('nin')) {
      const id = el.dataset.qid;
      const k = el.dataset.f ? el.dataset.f + el.dataset.i : 'g';
      DG.ans[id + '#' + k] = el.value;
      dgSave();
      const card = el.closest('.mcard');
      if (card) { card.classList.remove('ok', 'bad'); const r = card.querySelector('.qres'); if (r) r.textContent = ''; }
    }
  });

  body.addEventListener('change', (e) => {
    const el = e.target;
    if (el.classList && el.classList.contains('msel')) {
      DG.ans[el.dataset.qid + '#m' + el.dataset.mi] = el.value;
      dgSave();
      const card = el.closest('.qcard');
      if (card) { card.classList.remove('ok', 'bad'); const r = card.querySelector('.qres'); if (r) r.textContent = ''; }
      el.classList.remove('ok', 'bad');
    }
  });

  // 지문 형광펜 (선택 영역)
  $('#dgBody').addEventListener('pointerup', (e) => {
    if (DG.book && DG.book.kind === 'kor' && DG.ptool === 'hl' && e.target.closest('#dgPaper')) setTimeout(onPassageUp, 10);
  });

  // 숫자 키패드
  const kp = $('#dgKeypad');
  if (kp) {
    kp.addEventListener('pointerdown', (e) => {
      const k = e.target.closest('[data-k]');
      if (!k) return;
      e.preventDefault();
      const key = k.dataset.k;
      const el = DG.keyTarget;
      if (!el) return;
      if (key === 'bksp') el.value = el.value.slice(0, -1);
      else if (key === 'next') {
        const all = Array.from(document.querySelectorAll('.nin'));
        const i = all.indexOf(el);
        const nx = all[i + 1];
        if (nx) { nx.focus(); nx.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
        return;
      } else if (el.value.length < 3) el.value += key;
      el.dispatchEvent(new Event('input', { bubbles: true }));
    });
    kp.querySelector('#kpClose').addEventListener('pointerdown', (e) => { e.preventDefault(); showKeypad(false); });
  }
  document.addEventListener('focusin', (e) => {
    const el = e.target;
    if (el.classList && el.classList.contains('nin')) {
      DG.keyTarget = el;
      showKeypad(true);
    }
  });
  document.addEventListener('pointerdown', (e) => {
    if (e.target.closest && (e.target.closest('#dgKeypad'))) return;
    if (e.target.classList && e.target.classList.contains('nin')) return;
    if (!document.querySelector('#dgKeypad.show')) return;
    setTimeout(() => { if (!document.activeElement || !document.activeElement.classList.contains('nin')) showKeypad(false); }, 120);
  });
}

function showKeypad(on) {
  const kp = $('#dgKeypad');
  if (!kp) return;
  kp.classList.toggle('show', !!on);
}

/* 숫자 키패드 html (한 번만 만든다) */
function buildKeypad() {
  const kp = $('#dgKeypad');
  if (!kp || kp.dataset.ready) return;
  kp.dataset.ready = '1';
  kp.innerHTML = `<div class="kp-head"><span>🔢 숫자 넣기</span><button id="kpClose">숨기기</button></div>
    <div class="kp-grid">
      ${[1, 2, 3, 4, 5, 6, 7, 8, 9].map((n) => `<button data-k="${n}">${n}</button>`).join('')}
      <button data-k="bksp" class="wide2">⌫</button>
      <button data-k="0">0</button>
      <button data-k="next" class="go">다음 ▶</button>
    </div>`;
}


  /* -------------------------------------------------------------------- boot */
  async function boot() {
    try {
      await loadAll();
    } catch (err) {
      console.error(err);
      toast('저장 공간을 열지 못했어요. 사파리를 다시 열어 주세요.');
      S.lib = seedLibrary(); S.ready = true;
    }
    bind();
    buildKeypad();
    bindDigital();
    renderShelf();
    show('shelf');
    if (!localStorage.getItem('ysp-ver')) {
      localStorage.setItem('ysp-ver', '1');
    }
  }

  // small inspection hook (used by automated checks)
  window.__YSP = {
    strokes: () => S.strokes.length,
    redo: () => S.redo.length,
    done: () => Object.keys(S.done).length,
    tool: () => S.tool,
    penOnly: () => S.penOnly,
    page: () => S.pageKey,
    library: () => S.lib
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
