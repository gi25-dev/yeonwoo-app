<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="연우 공부방">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6efe4">
<title>연우 공부 패드</title>
<style>:root {
  --cream: #f6efe4;
  --cream-deep: #ece1d1;
  --paper: #fffdf8;
  --ink: #2a231c;
  --ink-soft: #6f6357;
  --line: #e4d8c6;
  --accent: #e8613c;
  --accent-soft: #fde9e2;
  --blue: #2f6feb;
  --green: #17936a;
  --shadow: 0 8px 20px rgba(90, 65, 40, .10), 0 2px 5px rgba(90, 65, 40, .07);
  --radius: 18px;
  --hdr: 58px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", system-ui, sans-serif;
  background: var(--cream);
  color: var(--ink);
  overscroll-behavior: none;
  -webkit-text-size-adjust: 100%;
  font-size: 16px;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
button:active { transform: translateY(1px); }
input, select { font: inherit; color: inherit; }

#app { height: 100%; height: 100dvh; display: flex; flex-direction: column; }
.view { flex: 1; display: none; flex-direction: column; min-height: 0; }
.view.active { display: flex; }
body.in-pad { overflow: hidden; }

/* ---------- shelf ---------- */
.topbar {
  height: var(--hdr);
  padding: var(--safe-t) 16px 0;
  display: flex; align-items: center; gap: 10px;
  background: linear-gradient(180deg, #fffaf2, #f8f1e6);
  border-bottom: 1px solid var(--line);
  flex: none;
}
.topbar .brand { font-size: 19px; font-weight: 800; letter-spacing: -.4px; margin-right: auto;
  display: flex; align-items: center; gap: 8px; }
.topbar .brand small { font-weight: 600; font-size: 12px; color: var(--ink-soft); letter-spacing: 0; }
.btn-soft {
  background: #fff; border: 1px solid var(--line); border-radius: 999px;
  padding: 7px 13px; font-size: 13.5px; font-weight: 700; color: var(--ink-soft);
  box-shadow: 0 1px 2px rgba(90, 65, 40, .06); white-space: nowrap;
}
.btn-soft.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn-soft:disabled { opacity: .45; }

.shelf-scroll { flex: 1; overflow-y: auto; padding: 12px 16px calc(24px + var(--safe-b)); -webkit-overflow-scrolling: touch; }
.subject { display: grid; grid-template-columns: 62px 1fr; column-gap: 12px; align-items: start; margin-bottom: 14px; }
.subject-head { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; margin: 0; padding-top: 6px; }
.subject-head h2 { margin: 0; font-size: 15px; line-height: 1.25; font-weight: 800; letter-spacing: -.3px; }
.subject-head .sub-count { font-size: 12px; color: var(--ink-soft); font-weight: 600; }
.subject-head .del-subject { margin: 4px 0 0; font-size: 11px; color: #b9a996; }

.ctag { position: absolute; left: 7px; top: 7px; font-size: 10px; font-weight: 800; letter-spacing: .02em;
  color: #fff; background: rgba(28, 22, 17, .55); padding: 2px 7px; border-radius: 7px; backdrop-filter: blur(3px); }

.grid { display: grid; gap: 13px 12px; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); }

.book { position: relative; display: flex; flex-direction: column; gap: 6px; padding: 0; text-align: left; border-radius: var(--radius); }
.cover {
  position: relative; width: 100%; aspect-ratio: 3 / 4; border-radius: 10px;
  overflow: hidden; background: #fff; box-shadow: var(--shadow);
  border: 1px solid rgba(120, 95, 65, .10);
}
.cover img { width: 100%; height: 100%; object-fit: cover; display: block; background: #fff; }
.cover.plain { display: flex; align-items: center; justify-content: center; padding: 12px; }
.cover.plain .ct { font-size: 15px; font-weight: 800; line-height: 1.28; letter-spacing: -.4px; text-align: center; }
.cover.plain .ce { position: absolute; right: 9px; top: 8px; font-size: 20px; opacity: .9; }
.cover .spine {
  position: absolute; left: 0; top: 0; bottom: 0; width: 6px;
  background: linear-gradient(90deg, rgba(0,0,0,.20), rgba(255,255,255,.10));
}
.badge {
  position: absolute; right: 7px; bottom: 7px;
  background: rgba(24, 20, 16, .72); color: #fff; border-radius: 999px;
  font-size: 11px; font-weight: 800; padding: 3px 8px; backdrop-filter: blur(4px);
}
.badge.done { background: rgba(23, 147, 106, .92); }
.book-title { font-size: 13px; font-weight: 800; letter-spacing: -.3px; line-height: 1.28; }
.book-sub { font-size: 10.5px; color: var(--ink-soft); font-weight: 600; margin-top: 1px; line-height: 1.3;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.book .mini-del {
  position: absolute; right: -4px; top: -4px; width: 24px; height: 24px; border-radius: 50%;
  background: #fff; border: 1px solid var(--line); box-shadow: var(--shadow);
  font-size: 13px; display: none; align-items: center; justify-content: center;
}
body.editing .book.custom .mini-del { display: flex; }
.empty-note { font-size: 12.5px; color: #a4937f; padding: 2px 2px 6px; }

/* ---------- book detail ---------- */
.header-lite {
  height: var(--hdr); padding: var(--safe-t) 12px 0; flex: none;
  display: flex; align-items: center; gap: 10px;
  background: #fffaf2; border-bottom: 1px solid var(--line);
}
.icon-btn {
  width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center;
  font-size: 18px; background: #fff; border: 1px solid var(--line); flex: none;
}
.icon-btn.ghost { background: transparent; border-color: transparent; color: #9b8c7a; }
.header-lite .ht { font-size: 15px; font-weight: 800; letter-spacing: -.3px; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; }
.header-lite .hs { font-size: 11.5px; color: var(--ink-soft); font-weight: 600; }
.header-lite .spacer { flex: 1; }

.book-scroll { flex: 1; overflow-y: auto; padding: 16px 16px calc(28px + var(--safe-b)); }
#bookBody { max-width: 760px; width: 100%; margin: 0 auto; }
.book-hero { display: flex; gap: 14px; align-items: center; margin-bottom: 16px; }
.book-hero .cover { width: 96px; flex: none; }
.book-hero h1 { margin: 0 0 4px; font-size: 20px; font-weight: 850; letter-spacing: -.6px; }
.book-hero .hs2 { font-size: 12.5px; color: var(--ink-soft); font-weight: 600; margin-bottom: 8px; }
.progress-wrap { display: flex; align-items: center; gap: 8px; font-size: 11.5px; font-weight: 700; color: var(--ink-soft); }
.bar { flex: 1; height: 7px; border-radius: 99px; background: #e9dfd0; overflow: hidden; max-width: 190px; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, #f7a072, var(--accent)); border-radius: 99px; }

.unit-list { display: flex; flex-direction: column; gap: 10px; list-style: none; margin: 0; padding: 0; }
.unit-card {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 13px 14px;
  box-shadow: 0 2px 6px rgba(90, 65, 40, .05);
}
.unit-card .uicon { font-size: 20px; width: 34px; text-align: center; flex: none; }
.unit-card .ut { font-size: 14.5px; font-weight: 800; letter-spacing: -.3px; line-height: 1.3; }
.unit-card .us { font-size: 11.5px; color: var(--ink-soft); font-weight: 600; margin-top: 3px; }
.unit-card .ring { margin-left: auto; flex: none; font-size: 11.5px; font-weight: 800; color: var(--accent);
  background: var(--accent-soft); border-radius: 999px; padding: 5px 10px; }
.unit-card .ring.full { color: var(--green); background: #e6f6ef; }

.add-row { margin-top: 14px; display: flex; gap: 9px; flex-wrap: wrap; }
.dashed {
  flex: 1; min-width: 180px; border: 1.6px dashed #d3c3ad; border-radius: 16px; padding: 15px;
  font-size: 13.5px; font-weight: 800; color: #a58f76; background: rgba(255,255,255,.5);
}

/* ---------- pad ---------- */
.pad-top {
  height: 50px; flex: none; padding: var(--safe-t) 10px 0;
  display: flex; align-items: center; gap: 8px;
  background: #fffaf2; border-bottom: 1px solid var(--line);
}
.round-btn {
  width: 34px; height: 34px; border-radius: 50%; flex: none; display: grid; place-items: center;
  background: #f7b23c; color: #fff; font-size: 13px; font-weight: 900;
  box-shadow: 0 2px 6px rgba(180, 120, 20, .25), inset 0 -2px 0 rgba(0,0,0,.10);
}
.pt-wrap { min-width: 0; display: flex; flex-direction: column; justify-content: center; flex: 1 1 auto; }
.pad-top .pt { font-size: 13px; font-weight: 800; letter-spacing: -.3px; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; line-height: 1.25; }
.pad-top .ps { font-size: 10.5px; color: var(--ink-soft); font-weight: 600; line-height: 1.2;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pad-top .dotsep { color: #cbbdaa; }
.grade-btn {
  flex: none; margin-left: auto; border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 900;
  background: #fff; border: 1.5px solid #9fd3b8; color: #17835b; white-space: nowrap;
}
.grade-btn.on { background: var(--green); border-color: var(--green); color: #fff; }
.grade-btn.off { opacity: .45; }

.tools {
  flex: none; display: flex; align-items: center; gap: 6px; padding: 6px 10px;
  background: #fffdf9; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none;
}
.tools::-webkit-scrollbar { display: none; }
.tools .spacer { flex: 1; }
.tool {
  width: 36px; height: 36px; border-radius: 11px; font-size: 17px; flex: none;
  display: grid; place-items: center; background: #f4ece0; border: 1.5px solid transparent;
}
.tool.on { background: #fff; border-color: var(--accent); box-shadow: 0 2px 8px rgba(232, 97, 60, .18); }
.penmode { flex: none; display: flex; align-items: center; gap: 4px; border-radius: 11px; padding: 0 10px;
  height: 36px; font-size: 12px; font-weight: 800; background: #f4ece0; color: #8b7a66; border: 1.5px solid transparent; white-space: nowrap; }
.penmode.on { background: #fff; border-color: var(--accent); color: var(--accent); }
.swatches { display: flex; gap: 6px; align-items: center; padding: 0 4px; }
.sw { width: 24px; height: 24px; border-radius: 50%; border: 2.5px solid #fff;
  box-shadow: 0 0 0 1.4px #dccfbd; flex: none; }
.sw.on { box-shadow: 0 0 0 2.6px var(--ink); }
.dots { display: flex; gap: 3px; align-items: center; padding: 0 3px; }
.dot-btn { width: 28px; height: 32px; border-radius: 9px; display: grid; place-items: center; background: #f4ece0; }
.dot-btn.on { background: #fff; box-shadow: inset 0 0 0 1.5px var(--accent); }
.dot { background: #3b3128; border-radius: 50%; }
.sep { width: 1px; height: 24px; background: var(--line); margin: 0 2px; flex: none; }
.pagenav { display: flex; align-items: center; gap: 2px; flex: none; }
.pagenav button { height: 32px; padding: 0 8px; border-radius: 9px; font-size: 11.5px; font-weight: 800; color: #8b7a66;
  background: #f4ece0; display: flex; align-items: center; gap: 2px; white-space: nowrap; }
.pagenav button:disabled { opacity: .3; }
.pagenav #pageno { min-width: 54px; text-align: center; font-size: 11.5px; font-weight: 800; color: #6a5f4f; }

.stage {
  flex: 1; min-height: 0; overflow: hidden; padding: 6px 8px;
  display: flex; align-items: center; justify-content: center;
  background:
    radial-gradient(circle at 20% 0%, #fff9f0, transparent 60%),
    #e9dfd0;
  -webkit-overflow-scrolling: touch;
}
.spread { position: relative; flex: none; }
.pg {
  position: absolute; top: 0; overflow: hidden; background: #fff; border-radius: 5px;
  box-shadow: 0 10px 24px rgba(80, 55, 30, .18), 0 2px 5px rgba(80, 55, 30, .10);
}
.pg.blank { background: repeating-linear-gradient(135deg, #fbf8f2 0 10px, #f6f1e8 10px 20px); box-shadow: none; opacity: .5; }
.pg .pageimg { width: 100%; height: 100%; object-fit: contain; display: block; user-select: none; -webkit-user-drag: none; pointer-events: none; background: #fff; }
.pg .sheet-wrap { position: absolute; inset: 0; overflow: hidden; background: #fff; pointer-events: none; }
.pg .sheet-wrap[hidden] { display: none; }
.pg .loading { position: absolute; inset: 0; display: grid; place-items: center; color: #b7a48d; font-size: 12px; font-weight: 700; }
/* 책등(가운데) 그림자 */
#pgLeft::after, #pgRight::after {
  content: ""; position: absolute; top: 0; bottom: 0; width: 26px; pointer-events: none;
  z-index: 3;
}
#pgLeft::after { right: 0; background: linear-gradient(90deg, rgba(60,45,30,0), rgba(60,45,30,.16)); }
#pgRight::after { left: 0; background: linear-gradient(270deg, rgba(60,45,30,0), rgba(60,45,30,.16)); }

#padCanvas { position: absolute; top: 0; left: 0; z-index: 5; touch-action: none; }
#padCanvas.pen-only { touch-action: pan-x pan-y; }
#padCanvas, .pg, .sheet { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }

/* ---------- 정답(채점) 시트 ---------- */
.ans-sheet {
  position: fixed; z-index: 30; right: 10px; bottom: calc(10px + var(--safe-b));
  width: min(330px, 46vw); max-height: 62vh; display: flex; flex-direction: column;
  background: #fffdf9; border: 1px solid var(--line); border-radius: 16px;
  box-shadow: 0 16px 40px rgba(60, 40, 20, .26);
}
.ans-sheet[hidden] { display: none; }
.ans-h { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid #efe6d6; }
.ans-h .t { font-size: 13px; font-weight: 900; color: #1a7d58; }
.ans-x { margin-left: auto; width: 26px; height: 26px; border-radius: 50%; background: #f3ebdd; color: #8a7a64; font-size: 12px; font-weight: 800; }
.ans-body { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 10px 10px; -webkit-overflow-scrolling: touch; }
.ans-g { margin-bottom: 10px; }
.ans-gt { display: flex; align-items: baseline; gap: 8px; font-size: 12px; font-weight: 900; color: #b3652f;
  background: #fdf2e3; border-radius: 8px; padding: 4px 9px; margin-bottom: 6px; }
.ans-gt small { font-size: 11px; font-weight: 700; color: #9a8b78; }
.ans-row { display: flex; gap: 7px; padding: 4px 3px; border-bottom: 1px dotted #f0e7d8; }
.ans-row:last-child { border-bottom: 0; }
.ans-n { flex: none; min-width: 22px; height: 20px; border-radius: 6px; background: #eef4ff; color: #2f6feb;
  font-size: 11px; font-weight: 900; display: grid; place-items: center; padding: 0 4px; }
.ans-v { font-size: 13.5px; font-weight: 800; line-height: 1.45; color: #2c2720; }
.ans-q { color: #8b7f6d; font-weight: 700; margin-right: 2px; }
.ans-note { display: block; font-size: 10.5px; font-weight: 600; color: #a2947f; margin-top: 1px; }
.ans-empty { font-size: 12px; color: #a2947f; font-weight: 700; padding: 6px 4px 10px; }
.ans-foot { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-top: 1px solid #efe6d6; }
.af-note { font-size: 10px; font-weight: 700; color: #b0a28e; line-height: 1.3; }
.ans-done { margin-left: auto; flex: none; border-radius: 999px; padding: 6px 11px; font-size: 11.5px; font-weight: 900;
  background: #fff; border: 1.4px solid #9fd3b8; color: #1a8a60; white-space: nowrap; }
.ans-done.on { background: var(--green); border-color: var(--green); color: #fff; }

/* ---------- 원본 보기 ---------- */
.orig-pop { position: fixed; inset: 0; z-index: 45; background: rgba(32, 25, 18, .6); display: grid; place-items: center; padding: 14px; }
.orig-pop[hidden] { display: none; }
.orig-card { position: relative; max-width: min(96vw, 980px); max-height: 94vh; background: #fff; border-radius: 14px; padding: 10px; box-shadow: 0 20px 50px rgba(0,0,0,.4); }
.orig-imgs { display: flex; gap: 10px; max-height: calc(94vh - 20px); }
.orig-imgs figure { margin: 0; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.orig-imgs img { max-width: 100%; max-height: calc(94vh - 44px); object-fit: contain; border-radius: 6px; }
.orig-imgs figcaption { font-size: 11px; font-weight: 700; color: #9a8b78; text-align: center; }
.orig-x { position: absolute; right: -10px; top: -10px; width: 34px; height: 34px; border-radius: 50%; background: #fff; box-shadow: 0 4px 12px rgba(0,0,0,.3); font-size: 14px; font-weight: 800; z-index: 2; }

/* ---------- modal ---------- */
.modal-back {
  position: fixed; inset: 0; background: rgba(40, 30, 22, .42); backdrop-filter: blur(3px);
  display: none; align-items: center; justify-content: center; padding: 18px; z-index: 40;
}
.modal-back.show { display: flex; }
.modal {
  width: min(430px, 100%); max-height: 86vh; overflow-y: auto; background: #fffdf9;
  border-radius: 22px; padding: 20px; box-shadow: 0 24px 60px rgba(50, 35, 20, .32);
}
.modal h3 { margin: 0 0 14px; font-size: 17px; font-weight: 850; letter-spacing: -.4px; }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12px; font-weight: 800; color: #8b7a66; margin-bottom: 5px; }
.field input[type=text], .field select {
  width: 100%; padding: 11px 12px; border-radius: 12px; border: 1.5px solid var(--line);
  background: #fff; font-size: 14.5px; font-weight: 600;
}
.field input:focus, .field select:focus { outline: none; border-color: var(--accent); }
.color-row { display: flex; gap: 9px; flex-wrap: wrap; }
.color-pick { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 1.5px #ddd0bd; }
.color-pick.on { box-shadow: 0 0 0 3px var(--ink); }
.file-btn {
  display: block; width: 100%; text-align: center; padding: 12px; border-radius: 12px;
  border: 1.6px dashed #d3c3ad; color: #a58f76; font-weight: 800; font-size: 13px; background: #fff;
}
.modal-actions { display: flex; gap: 9px; margin-top: 16px; }
.modal-actions button { flex: 1; padding: 12px; border-radius: 13px; font-weight: 800; font-size: 14px; }
.modal-actions .cancel { background: #f1e8db; color: #7d6c59; }
.modal-actions .ok { background: var(--accent); color: #fff; }
.modal-actions .ok.danger { background: #d93a2b; }
.hint { font-size: 12px; color: #9b8a76; line-height: 1.45; margin-top: 8px; }

.toast {
  position: fixed; left: 50%; bottom: calc(76px + var(--safe-b)); transform: translateX(-50%) translateY(14px);
  background: rgba(35, 27, 20, .92); color: #fff; padding: 10px 16px; border-radius: 999px;
  font-size: 13px; font-weight: 700; opacity: 0; transition: .22s; pointer-events: none; z-index: 60;
  max-width: 86vw; text-align: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.narrow { display: none; }

@media (max-width: 900px) {
  .tools { flex-wrap: wrap; row-gap: 5px; }
  .tools .spacer { display: none; }
  .pagenav { margin-left: auto; }
}
@media (max-width: 760px) {
  .pad-top { gap: 6px; padding-left: 8px; padding-right: 8px; }
  .pad-top .pt { font-size: 12px; }
  .grade-btn { padding: 7px 11px; font-size: 12px; }
  .tools { gap: 4px; padding: 6px 8px; }
  .tool { width: 33px; height: 33px; font-size: 15px; border-radius: 10px; }
  .penmode { height: 33px; padding: 0 8px; font-size: 11px; }
  .sw { width: 21px; height: 21px; }
  .dot-btn { width: 25px; height: 30px; }
  .pagenav button { height: 30px; padding: 0 7px; }
  .pagenav .lbl { display: none; }
  .ans-sheet { left: 8px; right: 8px; width: auto; max-height: 54vh; }
  .orig-imgs { flex-direction: column; }
}
@media (max-width: 520px) {
  .subject { display: block; }
  .subject-head { flex-direction: row; align-items: baseline; gap: 8px; margin: 0 2px 7px; padding-top: 0; }
  .tools { flex-wrap: wrap; row-gap: 5px; }
  .tools .sep { display: none; }
  .wide { display: none; }
  .narrow { display: inline; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 11px; }
  .book-title { font-size: 12.5px; }
  .topbar .brand small { display: none; }
  .stage { padding: 4px; }
}

/* ===================================================================
   디지털 학습지 시트 — 한 쪽 = 880 × 1240 (A4 세로 비율)
   두 쪽을 나란히 펼치면 실제 문제집처럼 보인다.
   =================================================================== */
.sheet {
  width: 880px; height: 1240px; flex: none;
  background: #fff;
  color: #211f1a;
  padding: 34px 44px 20px;
  font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Noto Sans CJK KR", system-ui, sans-serif;
  font-size: 22px; line-height: 1.55;
  letter-spacing: -.012em;
  display: flex; flex-direction: column;
  transform-origin: top left;
  position: relative;
  text-align: left;
}
.sheet * { box-sizing: border-box; }
.sheet p { margin: 0; }

  /* --------------------------------------------------------------- layout */
  function layoutSpread() {
    const st = $('#stage');
    const availW = Math.max(160, st.clientWidth - 16);
    const availH = Math.max(160, st.clientHeight - 12);
    const n = S.spread ? 2 : 1;
    const gap = n === 2 ? 10 : 0;
    const ar = SHEET.w / SHEET.h;
    let pw = (availW - gap) / n;
    let ph = pw / ar;
    if (ph > availH) { ph = availH; pw = ph * ar; }
    pw = Math.floor(pw); ph = Math.floor(ph);
    const sp = spread();
    sp.style.width = (pw * n + gap) + 'px';
    sp.style.height = ph + 'px';    S.rects = [];
    for (let i = 0; i < n; i++) {
      const el = $('#pg' + (i === 0 ? 'Left' : 'Right'));
      el.style.width = pw + 'px';
      el.style.height = ph + 'px';
      el.style.left = (i * (pw + gap)) + 'px';
      S.rects.push({ x: i * (pw + gap), y: 0, w: pw, h: ph });
    }
    /* 시트 확대·축소 */
    for (let i = 0; i < 2; i++) {
      const sh = $('#sheet' + (i === 0 ? 'L' : 'R'));
      if (sh) sh.style.transform = 'scale(' + (pw / SHEET.w) + ')';
    }
    sizeCanvas();
    fitSheets();
  }

  /* 기기 글꼴 차이로 지문이 넘치면 살짝 줄여 종이 안에 맞춘다 */
  function fitSheets() {
    ['L', 'R'].forEach((s) => {
      const box = $('#sheet' + s + ' .fit');
      if (!box) return;
      let fs = parseFloat(getComputedStyle(box).fontSize) || 22;
      let lh = fs * 1.55;
      let guard = 0;
      while (box.scrollHeight > box.clientHeight + 2 && guard < 14) {
        fs -= 0.5; lh = fs * 1.55;
        box.querySelectorAll('p').forEach((p) => { p.style.fontSize = fs + 'px'; p.style.lineHeight = lh + 'px'; });
        guard++;
      }
    });
  }

  function sizeCanvas() {
    const cv = canvas(), sp = spread();
    const w = sp.clientWidth, h = sp.clientHeight;
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    cv.style.width = w + 'px'; cv.style.height = h + 'px';
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    const ctx = ctx2d();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    redrawAll();
  }

  function tracePath(ctx, d) {
    const n = d.length / 2;
    ctx.beginPath();
    if (n === 0) return;
    ctx.moveTo(d[0], d[1]);
    if (n === 1) return;
    if (n === 2) { ctx.lineTo(d[2], d[3]); return; }
    for (let i = 1; i < n - 1; i++) {
      const xc = (d[2 * i] + d[2 * i + 2]) / 2;
      const yc = (d[2 * i + 1] + d[2 * i + 3]) / 2;
      ctx.quadraticCurveTo(d[2 * i], d[2 * i + 1], xc, yc);
    }
    ctx.lineTo(d[2 * (n - 1)], d[2 * (n - 1) + 1]);
  }

  /* 한 쪽 좌표계(0~1)로 옮겨 그린다 */
  function paintPageStrokes(ctx, rect, strokes) {
    if (!rect || !strokes || !strokes.length) return;
    ctx.save();
    ctx.translate(rect.x, rect.y);
    ctx.beginPath(); ctx.rect(0, 0, rect.w, rect.h); ctx.clip();
    for (const st of strokes) {
      const d = st.d;
      if (!d || d.length < 2) continue;
      ctx.save();
      if (st.t === 'h') { ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 0.40; }
      else if (st.t === 'e') { ctx.globalCompositeOperation = 'destination-out'; ctx.globalAlpha = 1; }
      else { ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1; }
      const lw = Math.max(0.7, (st.w || 0.008) * rect.w);
      ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.strokeStyle = st.c || '#22201d'; ctx.fillStyle = st.c || '#22201d';
      if (d.length === 2) {
        ctx.beginPath(); ctx.arc(d[0] * rect.w, d[1] * rect.h, lw / 2, 0, Math.PI * 2); ctx.fill();
      } else {
        const pts = d.map((v, i) => (i % 2 ? v * rect.h : v * rect.w));
        tracePath(ctx, pts);
        ctx.stroke();
      }
      ctx.restore();
    }
    ctx.restore();
  }

  function redrawAll() {
    const cv = canvas(), ctx = ctx2d();
    ctx.clearRect(0, 0, cv.clientWidth, cv.clientHeight);
    for (let i = 0; i < S.rects.length; i++) {
      const k = S.keys[i];
      if (!k) continue;
      paintPageStrokes(ctx, S.rects[i], S.ink[k] || []);
    }
  }

  /* ------------------------------------------------------------ drawing I/O */
  function hitPage(clientX, clientY) {
    const r = canvas().getBoundingClientRect();
    const x = clientX - r.left, y = clientY - r.top;
    for (let i = 0; i < S.rects.length; i++) {
      const a = S.rects[i];
      if (x >= a.x && x <= a.x + a.w && y >= a.y && y <= a.y + a.h) return i;
    }
    return -1;
  }

  function norm(slot, clientX, clientY) {
    const r = canvas().getBoundingClientRect();
    const a = S.rects[slot];
    return [
      clamp((clientX - r.left - a.x) / a.w, 0, 1),
      clamp((clientY - r.top - a.y) / a.h, 0, 1)
    ];
  }

  function onDown(e) {
    if (!S.ready) return;
    const type = e.pointerType || 'mouse';
    if (type === 'pen') {
      S.active.add(e.pointerId);
      if (S.cur) return;
      startStroke(e);
      return;
    }
    if (S.penOnly) return;                       // 손가락은 화면 조작만
    S.active.add(e.pointerId);
    if (S.active.size > 1) { abortStroke(); return; }
    startStroke(e);
  }

  function startStroke(e) {
    const slot = hitPage(e.clientX, e.clientY);
    if (slot < 0) return;
    const k = S.keys[slot];
    if (!k) return;
    e.preventDefault();
    const cv = canvas();
    if (cv.setPointerCapture) { try { cv.setPointerCapture(e.pointerId); } catch (err) {} }
    const [x, y] = norm(slot, e.clientX, e.clientY);
    const st = { t: S.tool === 'hl' ? 'h' : S.tool === 'eraser' ? 'e' : 'p', c: curColor(), w: curWidth(), d: [x, y] };
    S.cur = { slot, key: k, st };
    S.lastKey = k;
    S.ink[k].push(st);
    (S.undo[k] = S.undo[k] || []).push(st);
    S.redo[k] = [];
    redrawAll();
    buildTools();
  }

  function onMove(e) {
    if (!S.cur) return;
    e.preventDefault();
    const { slot, st } = S.cur;
    const [x, y] = norm(slot, e.clientX, e.clientY);
    const d = st.d;
    const lx = d[d.length - 2], ly = d[d.length - 1];
    if (Math.hypot(x - lx, y - ly) < 0.0015) return;
    d.push(x, y);
    const a = S.rects[slot];
    const ctx = ctx2d();
    ctx.save();
    ctx.translate(a.x, a.y);
    if (st.t === 'h') { ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 0.40; }
    else if (st.t === 'e') { ctx.globalCompositeOperation = 'destination-out'; ctx.globalAlpha = 1; }
    ctx.lineWidth = Math.max(0.7, st.w * a.w);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.strokeStyle = st.c;
    ctx.beginPath(); ctx.moveTo(lx * a.w, ly * a.h); ctx.lineTo(x * a.w, y * a.h); ctx.stroke();
    ctx.restore();
  }

  function onUp(e) {
    S.active.delete(e.pointerId);
    if (!S.cur) return;
    S.cur = null;
    redrawAll();
    scheduleSave();
  }

  function abortStroke() {
    if (S.cur) {
      const k = S.cur.key;
      const arr = S.ink[k];
      if (arr.length && arr[arr.length - 1] === S.cur.st) arr.pop();
      if (S.undo[k] && S.undo[k].length && S.undo[k][S.undo[k].length - 1] === S.cur.st) S.undo[k].pop();
      S.cur = null;
      redrawAll();
    }
  }

  /* --------------------------------------------------------------- ink saves */
  function scheduleSave() {
    clearTimeout(S.saveTimer);
    S.saveTimer = setTimeout(saveInkNow, 300);
  }
  async function saveInkNow() {
    clearTimeout(S.saveTimer);
    for (let i = 0; i < S.keys.length; i++) {
      const k = S.keys[i];
      if (!k) continue;
      try { await idbPut('ink', { k, s: S.ink[k] || [], u: Date.now() }); } catch (err) { console.warn(err); }
    }
  }

  /* ------------------------------------------------------------------ tools */
  function buildTools() {
    const sw = $('#swatches');
    const cols = S.tool === 'hl' ? HL_COLORS : PEN_COLORS;
    const active = S.tool === 'hl' ? S.hlColor : S.penColor;
    sw.innerHTML = S.tool === 'eraser' ? '' : cols.map((c) => `<button class="sw ${c === active ? 'on' : ''}" data-color="${c}" style="background:${c}"></button>`).join('');
    const dots = $('#dots');
    const arr = widthArr(S.tool), idx = widthIdx();
    dots.innerHTML = arr.map((v, i) => `<button class="dot-btn ${i === idx ? 'on' : ''}" data-w="${i}">
      <span class="dot" style="width:${7 + i * 6}px;height:${7 + i * 6}px"></span></button>`).join('');
    $$('.tool[data-tool]').forEach((t) => t.classList.toggle('on', t.dataset.tool === S.tool));
    const key = S.cur ? S.cur.key : (S.lastKey || S.keys[0]);
    const canUndo = !!(key && (S.undo[key] || []).length);
    const canRedo = !!(key && (S.redo[key] || []).length);
    $('#undoBtn').style.opacity = canUndo ? 1 : 0.35;
    $('#redoBtn').style.opacity = canRedo ? 1 : 0.35;

    m.querySelector('#pFiles').onchange = (e) => {
      files = Array.from(e.target.files || []);
      m.querySelector('#pFileHint').textContent = files.length ? `${files.length}장 선택됨: ${files.map((f) => f.name).slice(0, 3).join(', ')}${files.length > 3 ? ' …' : ''}` : '사진을 고르면 이 단원의 페이지로 들어가요.';
    };
    m.querySelector('#mNo').onclick = closeModal;
    m.querySelector('#mYes').onclick = async () => {
      if (!files.length) { toast('사진을 먼저 골라 주세요'); return; }
      let unit;
      if (uSel.value === '__new') {
        const t = m.querySelector('#uName').value.trim() || '새 단원';
        unit = { id: uid('u'), title: t, custom: true, pages: [] };
        b.units.push(unit);
      } else unit = b.units.find((u) => u.id === uSel.value);
      let i = unit.pages.length;
      for (const f of files) {
        const id = uid('pg');
        await idbPut('blobs', { k: id, blob: f });
        i += 1;
        unit.pages.push({ id: uid('p'), label: 'p.' + i, imgBlob: id, custom: true });
      }
      await saveLib();
      closeModal();
      await openBook(b.id);
      toast(`${files.length}쪽을 추가했어요`);
    };
  }

  /* -------------------------------------------------------------- nav wiring */
  function bind() {
    $('#shelfBody').addEventListener('click', async (e) => {
      const delBook = e.target.closest('[data-del-book]');
      if (delBook) {
        e.stopPropagation();
        const id = delBook.dataset.delBook;
        const f = findBook(id);
        if (await confirmBox('문제집 삭제', `<b>${esc(f.book.title)}</b>을(를) 지울까요? 필기한 내용도 함께 사라져요.`, '삭제', true)) {
          f.category.books = f.category.books.filter((x) => x.id !== id);
          await saveLib(); renderShelf();
        }
        return;
      }
      const delSub = e.target.closest('[data-del-subject]');
      if (delSub) {
        const id = delSub.dataset.delSubject;
        const s = S.lib.subjects.find((x) => x.id === id);
        if (await confirmBox('과목 삭제', `<b>${esc(s.name)}</b> 과목을 지울까요?`, '삭제', true)) {
          S.lib.subjects = S.lib.subjects.filter((x) => x.id !== id);
          await saveLib(); renderShelf();
        }
        return;
      }
      const b = e.target.closest('[data-book]');
      if (b) openBookOrPad(b.dataset.book);
    });
    $('#addSubjectBtn').onclick = addSubjectModal;
    $('#addBookBtn').onclick = addBookModal;

    $('#bookBack').onclick = () => { renderShelf(); show('shelf'); };
    $('#bookBody').addEventListener('click', (e) => {
      const u = e.target.closest('[data-unit]');
      if (u) openPad(S.bookId, u.dataset.unit, 0);
      if (e.target.closest('#addPagesBtn')) addPagesModal();
    });

    $('#padBack').onclick = async () => {
      if (window.__YSP_ANS) window.__YSP_ANS.close();
      await saveInkNow(); await openBook(S.bookId);
    };
    $('#ansBtn').onclick = toggleAnswers;
    $('#ansDone').onclick = toggleDone;
    $('#origClose').onclick = closeOrig;
    $('#origPop').addEventListener('click', (e) => { if (e.target.id === 'origPop') closeOrig(); });
    $('#tools').addEventListener('click', (e) => {
      const t = e.target.closest('[data-tool]');
      if (t) { setTool(t.dataset.tool); return; }
      const c = e.target.closest('[data-color]');
      if (c) {
        if (S.tool === 'hl') S.hlColor = c.dataset.color; else S.penColor = c.dataset.color;
        buildTools(); return;
      }
      const w = e.target.closest('[data-w]');
      if (w) {
        const i = +w.dataset.w;
        if (S.tool === 'hl') S.hlW = i; else if (S.tool === 'eraser') S.erW = i; else S.penW = i;
        buildTools(); return;
      }
      if (e.target.closest('#undoBtn')) {
        const k = S.lastKey || S.keys.find((x) => x && (S.undo[x] || []).length);
        if (!k) return;
        const u = S.undo[k] || [], r = S.redo[k] || [];
        if (!u.length) { toast('되돌릴 필기가 없어요'); return; }
        const st = u.pop();
        const arr = S.ink[k] || [];
        const i = arr.lastIndexOf(st);
        if (i >= 0) arr.splice(i, 1);
        r.push(st);
        redrawAll(); buildTools(); scheduleSave();
        return;
      }
      if (e.target.closest('#redoBtn')) {
        const k = S.lastKey || S.keys.find((x) => x && (S.redo[x] || []).length);
        if (!k) return;
        const u = S.undo[k] || [], r = S.redo[k] || [];
        if (!r.length) { toast('다시 실행할 필기가 없어요'); return; }
        const st = r.pop();
        (S.ink[k] = S.ink[k] || []).push(st);
        u.push(st);
        redrawAll(); buildTools(); scheduleSave();
        return;
      }
      if (e.target.closest('#clearBtn')) {
        const total = S.keys.reduce((a, k) => a + (k ? (S.ink[k] || []).length : 0), 0);
        if (!total) { toast('지울 필기가 없어요'); return; }
        confirmBox('이 장 지우기', '지금 펼친 두 쪽에 쓴 필기를 <b>모두</b> 지울까요? 되돌릴 수 없어요.', '모두 지우기', true).then(async (ok) => {
          if (!ok) return;
          S.keys.forEach((k) => { if (k) { S.ink[k] = []; S.undo[k] = []; S.redo[k] = []; } });
          redrawAll(); buildTools(); await saveInkNow(); toast('이 장을 지웠어요');
        });
        return;
      }
    });

    $('#prevBtn').onclick = async () => {
      if (S.pageIdx > 0) { await saveInkNow(); S.pageIdx = Math.max(0, S.pageIdx - (S.spread ? 2 : 1)); await loadSpread(false); }
    };
    $('#nextBtn').onclick = async () => {
      const u = findUnit(findBook(S.bookId).book, S.unitId);
      const step = S.spread ? 2 : 1;
      if (S.pageIdx + step < u.pages.length) { await saveInkNow(); S.pageIdx += step; await loadSpread(false); }
    };
    $('#penBtn').onclick = () => {
      S.penOnly = !S.penOnly;
      localStorage.setItem('ysp-penOnly', S.penOnly ? '1' : '0');
      updatePenModeUI();
      toast(S.penOnly ? '애플펜슬만 필기돼요 · 손가락은 화면 조작' : '손가락으로도 필기할 수 있어요');
    };
    $('#pageMenu').onclick = async () => {
      const u = findUnit(findBook(S.bookId).book, S.unitId);
      const hasOrig = S.pages.some((p, i) => p && $('#img' + (i === 0 ? 'L' : 'R')).dataset.src);
      const m = modal(`<h3>${esc($('#pageLabel').textContent || '페이지')} 메뉴</h3>
        <div class="modal-actions" style="flex-direction:column">
          ${hasOrig ? '<button class="cancel" id="mOrig">📄 원본 책 사진 보기</button>' : ''}
          <button class="cancel" id="mClear">이 장 필기 모두 지우기</button>
          <button class="cancel" id="mNo">닫기</button>
        </div>`);
      m.querySelector('#mNo').onclick = closeModal;
      const mo = m.querySelector('#mOrig');
      if (mo) mo.onclick = () => { closeModal(); openOrig(); };
      m.querySelector('#mClear').onclick = async () => {
        S.keys.forEach((k) => { if (k) { S.ink[k] = []; S.undo[k] = []; S.redo[k] = []; } });
        redrawAll(); buildTools(); await saveInkNow(); closeModal(); toast('이 장을 지웠어요');
      };
    };

    const cv = canvas();
    cv.addEventListener('pointerdown', onDown);
    cv.addEventListener('pointermove', onMove, { passive: false });
    cv.addEventListener('pointerup', onUp);
    cv.addEventListener('pointercancel', onUp);
    cv.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse' && S.cur) onUp(e); });
    cv.addEventListener('contextmenu', (e) => e.preventDefault());

    $('#modalBack').addEventListener('click', (e) => { if (e.target.id === 'modalBack') closeModal(); });
    document.addEventListener('ysp:ans', () => { if (S.view === 'pad') layoutSpread(); });
    $('#shelfBody').addEventListener('keydown', (e) => {
      const b = e.target.closest('[data-book]');
      if (b && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openBookOrPad(b.dataset.book); }
    });

    let rt = 0;
    window.addEventListener('resize', () => {
      clearTimeout(rt);
      rt = setTimeout(async () => {
        if (S.view !== 'pad') return;
        const was = S.spread;
        await saveInkNow();
        if (was !== isSpreadMode()) await loadSpread(true);
        else { layoutSpread(); }
      }, 180);
    });
    window.addEventListener('orientationchange', () => setTimeout(async () => {
      if (S.view !== 'pad') return;
      await saveInkNow();
      await loadSpread(true);
    }, 320));
    document.addEventListener('visibilitychange', () => { if (document.hidden) saveInkNow(); });
    window.addEventListener('pagehide', () => { saveInkNow(); });
    document.addEventListener('keydown', (e) => {
      if (S.view !== 'pad') return;
      const mod = e.metaKey || e.ctrlKey;
      if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); (e.shiftKey ? $('#redoBtn') : $('#undoBtn')).click(); }
      else if (e.key === 'ArrowRight') $('#nextBtn').click();
      else if (e.key === 'ArrowLeft') $('#prevBtn').click();
    });
  }

  /* ======================= 채점 · 정답 시트 (정답만) ======================= */
(function () {
  'use strict';

  const ANS = (window.__ANSWERS__ && window.__ANSWERS__.books) || {};
  const A = { open: false, book: null };
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function sheet() { return $('#ansSheet'); }
  function norm(s) { return String(s || '').replace(/\s+/g, '').toLowerCase(); }

  function groupFor(book, label) {
    if (!book || !book.groups) return null;
    const t = norm(label);
    let g = book.groups.find((x) => norm(x.page) === t);
    if (g) return g;
    // "p.146" vs "146" 같은 표기 차이 허용
    g = book.groups.find((x) => norm(x.page).indexOf(t) >= 0 || t.indexOf(norm(x.page)) >= 0);
    return g || null;
  }

  function render() {
    const book = ANS[A.book];
    const box = $('#ansBody');
    if (!book || !box) return;
    const html = A.pages.map((p) => {
      if (!p) return '';
      const g = groupFor(book, p.label) || groupFor(book, p.id);
      if (!g || !g.items || !g.items.length) return '';
      const rows = g.items.map((it) => `<div class="ans-row">
          <span class="ans-n">${esc(it.n)}</span>
          <span class="ans-v">${it.q ? `<b class="ans-q">${esc(it.q)}</b>` : ''}${esc(it.a)}${it.note ? `<span class="ans-note">${esc(it.note)}</span>` : ''}</span>
        </div>`).join('');
      return `<section class="ans-g">
        <div class="ans-gt">${esc(p.label || '')}<small>${esc(g.name || '')}</small></div>
        ${rows}
      </section>`;
    }).filter(Boolean).join('');
    box.innerHTML = html || '<div class="ans-empty">정답이 없어요</div>';
  }

  function has(bookId) { return !!ANS[bookId]; }

  function fire() { document.dispatchEvent(new CustomEvent('ysp:ans')); }

  function open() {
    if (!ANS[A.book]) return false;
    A.open = true;
    const s = sheet();
    if (s) s.hidden = false;
    render();
    fire();
    return true;
  }

  function close() {
    A.open = false;
    const s = sheet();
    if (s) s.hidden = true;
    const btn = $('#ansBtn');
    if (btn) btn.classList.remove('on');
    fire();
  }

  function toggle() {
    if (A.open) { close(); return; }
    if (open()) { const b = $('#ansBtn'); if (b) b.classList.add('on'); }
  }

  /* 패드가 장을 열 때마다 호출 */
  function refresh(bookId, pages, keys, done) {
    A.book = bookId;
    A.pages = (pages || []).filter(Boolean);
    const btn = $('#ansBtn');
    if (btn) {
      const ok = has(bookId);
      btn.classList.toggle('off', !ok);
      btn.textContent = '✅ 채점';
      btn.title = ok ? '이 장의 정답 보기' : '정답 준비 중';
    }
    if (A.open) { if (!ANS[bookId]) close(); else render(); }
  }

  function init() {
    const s = sheet();
    if (s) s.addEventListener('click', (e) => { if (e.target.closest('[data-ans-close]')) close(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && A.open) close(); });
  }

  window.__YSP_ANS = { init, refresh, close, toggle, open, has, isOpen: () => A.open };
})();


  /* -------------------------------------------------------------------- boot */
  async function boot() {
    try {
      await loadAll();
    } catch (err) {
      console.error(err);
      toast('저장 공간을 열지 못했어요. 사파리를 다시 열어 주세요.');
      S.lib = seedLibrary(); S.ready = true;
    }
    bind();
    if (window.__YSP_ANS) window.__YSP_ANS.init();
    renderShelf();
    show('shelf');
  }

  // small inspection hooks (used by automated checks)
  window.__YSP_DONE = () => S.done;
  window.__YSP = {
    strokes: () => S.keys.reduce((a, k) => a + (k ? (S.ink[k] || []).length : 0), 0),
    strokesByPage: () => S.keys.map((k) => (k ? (S.ink[k] || []).length : 0)),
    penOnly: () => S.penOnly,
    page: () => S.keys,
    view: () => S.view,
    sheets: () => S.pages.map((p, i) => (p ? ($('#pg' + (i === 0 ? 'Left' : 'Right')).dataset.sheet === '1') : false)),
    spread: () => S.spread,
    rects: () => S.rects,
    library: () => S.lib
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
